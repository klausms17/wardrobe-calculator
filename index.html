    const fillOptions = [
      { k:'drawer_box', name:'Ящик (наружный фасад)' },
      ...fillingOptionsForUI()
        .filter(([k]) => k !== 'custom')
        .map(([k, v]) => ({ k, name: v.name }))
    ];

    if (!isCustom){
      html += `
        <button class="bulk-btn" id="start-custom-stack" style="width:100%; margin-top:8px">
          ⬚ Собрать свою комбинацию зон (например: обувница внизу + штанга сверху)
        </button>`;
    } else {
      const stack = cell.stack || [];
      const zonesPreview = computeStackZones(stack, cellHmm_ce);
      // Зоны редактируются СВЕРХУ ВНИЗ в списке — визуально как шкаф (верхняя зона сверху)
      let rows = '';
      for (let i = stack.length - 1; i >= 0; i--){
        const z = stack[i];
        const zv = zonesPreview[i];
        const factH = zv ? (zv.topMm - zv.bottomMm) : 0;
        const isAuto = !z.h;
        rows += `
          <div class="stack-zone" data-zone-i="${i}">
            <select class="stack-zone-f" data-zone-f="${i}">
              ${fillOptions.map(o => `<option value="${o.k}" ${o.k===z.f?'selected':''}>${o.name}</option>`).join('')}
            </select>
            <div class="stack-zone-h">
              <input type="number" data-zone-h="${i}" min="0" max="2500" step="50"
                value="${z.h || ''}" placeholder="авто" ${isAuto?'class="auto"':''}>
              <span class="stack-zone-fact">${isAuto ? '≈'+factH : factH} мм</span>
            </div>
            <button class="stack-zone-del" data-zone-del="${i}" title="Удалить зону">✕</button>
          </div>`;
      }
      html += `
        <div class="stack-builder">
          <div class="stack-builder-head">
            <span>Зоны колонны · сверху вниз</span>
            <span class="stack-builder-total">всего ${cellHmm_ce} мм</span>
          </div>
          <button class="bulk-btn" id="stack-add-zone" style="width:100%; margin-bottom:6px">+ Добавить зону сверху</button>
          ${rows}
          <div class="stack-builder-hint">Высота в мм. Пусто = «авто» (зона делит остаток). Нижняя зона — последняя в списке.</div>
        </div>`;
    }
  }

  if (showSide){
    html += `
      <div class="section-label">Сторона петель</div>
      <div class="popover-side">
        <div class="ps ${cell.side==='left'?'on':''}" data-cell-side="left">Слева</div>
        <div class="ps ${cell.side==='right'?'on':''}" data-cell-side="right">Справа</div>
      </div>`;
  }

  if (showColor){
    html += `
      <div class="section-label">Цвет ${isWing?'фасада крыла':'ячейки'}</div>
      <div class="swatch-grid">
        <div class="swatch ${!cell.color?'on':''}" data-cell-color="" style="background:linear-gradient(135deg, var(--surface-2) 50%, var(--line) 50%)" title="Как корпус"></div>
        ${visibleColorEntries().map(([k,v]) => `
          <div class="swatch ${cell.color===k?'on':''}" data-cell-color="${k}" style="background:${v.hex}" title="${v.name}"></div>
        `).join('')}
      </div>`;
  }


  body.innerHTML = html;
  body.classList.remove('fade-in');
  void body.offsetWidth;
  body.classList.add('fade-in');
  attachCellEditHandlers();
}

function attachCellEditHandlers(){
  const editId = state.editingCell;
  const isWing = isWingId(editId);
  const target = () => isWing ? wingCellOf(editId) : state.cells[editId];

  document.querySelectorAll('[data-mm-cell]').forEach(el => {
    el.addEventListener('click', () => {
      const newIdx = parseInt(el.dataset.mmCell);
      state.editingCell = newIdx;
      updateCellHighlight();
      renderUI();
    });
  });
  document.querySelectorAll('[data-mm-wing]').forEach(el => {
    el.addEventListener('click', () => {
      state.editingCell = 'wing' + (parseInt(el.dataset.mmWing) || 0);
      updateCellHighlight();
      renderUI();
    });
  });
  document.querySelectorAll('[data-cell-type]').forEach(el => {
    el.addEventListener('click', () => { target().type = el.dataset.cellType; scheduleBuild(); renderUI(); });
  });
  document.querySelectorAll('[data-cell-filling]').forEach(el => {
    el.addEventListener('click', () => { target().filling = el.dataset.cellFilling; scheduleBuild(); renderUI(); });
  });

  // === Конструктор зон ===
  const startStackBtn = document.getElementById('start-custom-stack');
  if (startStackBtn){
    startStackBtn.addEventListener('click', () => {
      const t = target();
      // Стартовая комбинация из текущего наполнения + типовая нижняя зона
      const cur = (t.filling && t.filling !== 'auto' && t.filling !== 'custom') ? t.filling : 'rod';
      t.filling = 'custom';
      t.stack = [ { f:'shoes', h:500 }, { f:cur, h:0 } ]; // снизу обувница 500мм, сверху текущее на остаток
      scheduleBuild(); renderUI();
    });
  }
  const addZoneBtn = document.getElementById('stack-add-zone');
  if (addZoneBtn){
    addZoneBtn.addEventListener('click', () => {
      const t = target();
      if (!Array.isArray(t.stack)) t.stack = [];
      if (t.stack.length >= 5) return; // здравый предел
      t.stack.push({ f:'shelves', h:0 }); // новая зона сверху, авто-высота
      scheduleBuild(); renderUI();
    });
  }
  document.querySelectorAll('[data-zone-f]').forEach(el => {
    el.addEventListener('change', () => {
      const t = target();
      const i = parseInt(el.dataset.zoneF);
      if (t.stack && t.stack[i]){
        t.stack[i].f = el.value;
        // Наружный ящик с «авто»-высотой нелеп — подставляем типовые 250мм
        if (el.value === 'drawer_box' && !t.stack[i].h) t.stack[i].h = 250;
        scheduleBuild(); renderUI();
      }
    });
  });
  document.querySelectorAll('[data-zone-h]').forEach(el => {
    el.addEventListener('change', () => {
      const t = target();
      const i = parseInt(el.dataset.zoneH);
      if (t.stack && t.stack[i]){
        const v = parseInt(el.value);
        t.stack[i].h = (isNaN(v) || v <= 0) ? 0 : Math.min(2500, v);
        scheduleBuild(); renderUI();
      }
    });
  });
  document.querySelectorAll('[data-zone-del]').forEach(el => {
    el.addEventListener('click', () => {
      const t = target();
      const i = parseInt(el.dataset.zoneDel);
      if (t.stack && t.stack.length > 1){
        t.stack.splice(i, 1);
        scheduleBuild(); renderUI();
      } else if (t.stack && t.stack.length === 1){
        // Удалили последнюю зону — возвращаемся к обычному наполнению
        t.filling = t.stack[0].f;
        delete t.stack;
        scheduleBuild(); renderUI();
      }
    });
  });
  document.querySelectorAll('[data-cell-side]').forEach(el => {
    el.addEventListener('click', () => { target().side = el.dataset.cellSide; scheduleBuild(); renderUI(); });
  });
  document.querySelectorAll('[data-cell-color]').forEach(el => {
    el.addEventListener('click', () => { target().color = el.dataset.cellColor || null; scheduleBuild(); renderUI(); });
  });
  // Шаблон колонны — применяется к ВСЕЙ колонне выбранной ячейки с распределением по высоте
  document.querySelectorAll('[data-cell-preset]').forEach(el => {
    el.addEventListener('click', () => {
      if (isWing) return;
      const c = editId % state.cols;
      applyColumnPreset(c, el.dataset.cellPreset);
      scheduleBuild(); renderUI();
    });
  });
}

function gridRadios(label, key, min, max){
  let buttons = '';
  for (let n = min; n <= max; n++){
    buttons += `<button class="gr ${state[key]===n?'on':''}" data-grid-set="${key}" data-grid-val="${n}">${n}</button>`;
  }
  return `<div class="grid-row${label?'':' no-label'}">
    ${label ? `<span class="grid-row-label">${label}</span>` : ''}
    <div class="grid-radios">${buttons}</div>
  </div>`;
}

function renderStepBody(){
  const body = document.getElementById('step-body');
  const html = [];

  if (state.step === 1){
    // ============================================
    // Естественный порядок сборки шкафа:
    // форма → размеры → секции → материалы. Всё главное на виду.
    // ============================================

    // 1. ФОРМА — первое решение
    html.push(`<div class="section-label">Форма шкафа</div>`);
    html.push(`<div class="tile-grid cols-3" style="margin-bottom:16px">
      ${Object.entries(SHAPES).map(([k,v]) => `
        <div class="tile shape-tile ${state.shape===k?'on':''}" data-shape="${k}">
          <div class="tile-icon">${ICONS[v.icon]}</div>
          <div class="tile-label">${v.name}</div>
          <div class="tile-sub">${v.sub}</div>
        </div>`).join('')}
    </div>`);

    if (SHAPES[state.shape].hasWing){
      html.push(sliderField('Длина крыла', 'wingLength', 300, 2000, 10, 'мм'));
      html.push(`<div class="section-label">Секций в крыле по высоте <span style="float:right;font-family:Fraunces,serif;font-size:15px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--text)">${state.wingRows}</span></div>`);
      html.push(gridRadios('', 'wingRows', 1, 6));
    }

    // 2. РАЗМЕРЫ
    html.push(`<div class="section-label">Размеры</div>`);
    html.push(sliderField('Ширина', 'width', 400, 4000, 10, 'мм'));
    html.push(sliderField('Высота', 'height', 1500, 3000, 10, 'мм'));
    html.push(sliderField('Глубина', 'depth', 300, 800, 10, 'мм'));

    // 3. СЕКЦИИ — колонны и ряды рядом
    html.push(`<div class="section-label">Колонн по ширине <span style="float:right;font-family:Fraunces,serif;font-size:15px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--text)">${state.cols}</span></div>`);
    html.push(gridRadios('', 'cols', 2, 8));
    html.push(`<div class="section-label">Секций по высоте <span style="float:right;font-family:Fraunces,serif;font-size:15px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--text)">${state.rows}</span></div>`);
    html.push(gridRadios('', 'rows', 1, 6));

    // 4. МАТЕРИАЛЫ — сначала из чего (ЛДСП/МДФ), потом цвет
    html.push(`<div class="section-label">Материал корпуса <span style="float:right;text-transform:none;letter-spacing:0;font-size:11px;color:var(--text-2);font-weight:400">${CONFIG.materials[state.bodyMaterial].name}</span></div>`);
    html.push(`<div class="tile-grid cols-2">
      ${Object.entries(CONFIG.materials).map(([k,v]) => `
        <div class="tile ${state.bodyMaterial===k?'on':''}" data-bodymaterial="${k}">
          <div class="tile-label">${v.name}</div>
          <div class="tile-sub">${v.sub}</div>
        </div>`).join('')}
    </div>`);
    html.push(`<div class="section-label">Цвет корпуса <span style="float:right;text-transform:none;letter-spacing:0;font-size:11px;color:var(--text-2);font-weight:400">${COLORS[state.bodyColor].name}</span></div>`);
    html.push(`<div class="swatch-grid">
      ${visibleColorEntries().map(([k,v]) => `
        <div class="swatch ${state.bodyColor===k?'on':''}" data-bodycolor="${k}" style="background:${v.hex}" title="${v.name}"></div>
      `).join('')}
    </div>`);
    html.push(`<div class="section-label">Материал фасадов <span style="float:right;text-transform:none;letter-spacing:0;font-size:11px;color:var(--text-2);font-weight:400">${CONFIG.materials[state.facadeMaterial].name}</span></div>`);
    html.push(`<div class="tile-grid cols-2">
      ${Object.entries(CONFIG.materials).map(([k,v]) => `
        <div class="tile ${state.facadeMaterial===k?'on':''}" data-facadematerial="${k}">
          <div class="tile-label">${v.name}</div>
          <div class="tile-sub">${v.sub}</div>
        </div>`).join('')}
    </div>`);
    html.push(`<div class="section-label">Цвет фасадов <span style="float:right;text-transform:none;letter-spacing:0;font-size:11px;color:var(--text-2);font-weight:400">${COLORS[state.defaultDoorColor].name}</span></div>`);
    html.push(`<div class="swatch-grid">
      ${visibleColorEntries().map(([k,v]) => `
        <div class="swatch ${state.defaultDoorColor===k?'on':''}" data-defaultdoorcolor="${k}" style="background:${v.hex}" title="${v.name}"></div>
      `).join('')}
    </div>`);

    // ============================================
    // ДОПОЛНИТЕЛЬНО — всегда видно, отделено визуально (без сворачивания)
    // ============================================
    html.push(`<div class="extra-block">
      <div class="extra-block-title">Дополнительно</div>`);

    html.push(`<div class="section-label">Цоколь <span style="float:right;text-transform:none;letter-spacing:0;font-size:12px;color:var(--text-2);font-weight:400">${state.socket === 0 ? 'без цоколя' : state.socket + ' мм'}</span></div>`);
    html.push(`<div class="tile-grid cols-4">
      ${[[0,'без'],[60,'60 мм'],[100,'100 мм'],[150,'150 мм']].map(([v,n]) => `
        <div class="tile ${state.socket===v?'on':''}" data-socket="${v}">
          <div class="tile-label">${n}</div>
        </div>`).join('')}
    </div>`);

    html.push(`<div class="section-label">Антресоль</div>`);
    html.push(`<div class="toggle-row ${state.antresol?'on':''}" data-toggle="antresol">
      <div class="t-text">
        <div class="t-title">Антресоль сверху</div>
        <div class="t-desc">Дополнительная секция для редко используемых вещей</div>
      </div>
      <div class="switch"></div>
    </div>`);
    if (state.antresol){
      html.push(sliderField('Высота антресоли', 'antresolH', 50, 500, 10, 'мм'));
    }

    // Задняя стенка
    const bwCfg = CONFIG.backWalls[state.backWall] || CONFIG.backWalls.hdf_white;
    html.push(`<div class="section-label">Задняя стенка <span style="float:right;text-transform:none;letter-spacing:0;font-size:11px;color:var(--text-2);font-weight:400">${bwCfg.name}</span></div>`);
    html.push(`<div class="tile-grid cols-3">
      ${Object.entries(CONFIG.backWalls).map(([k,v]) => `
        <div class="tile compact ${state.backWall===k?'on':''}" data-backwall="${k}">
          <div class="tile-icon" style="margin-bottom:4px">
            ${v.hex
              ? `<div style="width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,0.18);background:${v.hex.toString().startsWith('#') ? v.hex : '#'+v.hex.toString(16).padStart(6,'0')}"></div>`
              : (k === 'none'
                ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="4" y="4" width="16" height="16" stroke-dasharray="2,2"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`
                : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="4" y="4" width="16" height="16"/><line x1="4" y1="10" x2="20" y2="10"/></svg>`)}
          </div>
          <div class="tile-label">${v.name}</div>
          <div class="tile-sub">${v.sub}</div>
        </div>`).join('')}
    </div>`);

    html.push(`</div>`);
  }

  if (state.step === 2){
    // На шаге 2 cell-edit активируется автоматически. Этот блок виден когда колонна не выбрана.
    html.push(`<div class="note" style="margin-top:4px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg><span>Кликни по колонне в 3D — настроишь её фасад, наполнение и сторону открывания. Или собери свою комбинацию зон (обувница, ящики, штанга — в одной колонне).</span></div>`);

    html.push(`<div class="section-label">Быстрое заполнение — все секции сразу</div>`);
    html.push(`<div class="bulk-actions">
      <button class="bulk-btn" data-bulk="door">Все двери</button>
      <button class="bulk-btn" data-bulk="open">Все открытые</button>
      <button class="bulk-btn" data-bulk="drawer">Все ящики</button>
      <button class="bulk-btn" data-bulk="mirror">Все зеркала</button>
    </div>`);
  }

  if (state.step === 3){
    const ts = (k, title, desc, badge) => `
      <div class="toggle-row ${state[k]?'on':''}" data-toggle="${k}">
        <div class="t-text">
          <div class="t-title">${title}${badge?`<span class="badge">${badge}</span>`:''}</div>
          <div class="t-desc">${desc}</div>
        </div>
        <div class="switch"></div>
      </div>`;

    html.push(`<div class="section-label">Ручки</div>`);
    html.push(`<div class="tile-grid cols-4">
      ${Object.entries(HANDLES).map(([k,v]) => `
        <div class="tile ${state.defaultHandle===k?'on':''}" data-handle="${k}">
          <div class="tile-label">${v.name}</div>
          <div class="tile-sub">${v.sub}</div>
        </div>`).join('')}
    </div>`);

    html.push(`<div class="section-label">Петли дверей</div>`);
    html.push(`<div class="tile-grid cols-3">
      ${Object.entries(CONFIG.hinges).map(([k,v]) => `
        <div class="tile ${state.hinges===k?'on':''}" data-hinges="${k}">
          <div class="tile-label">${v.name}</div>
          <div class="tile-sub">${v.sub} · ${v.price} ₽/шт</div>
        </div>`).join('')}
    </div>`);

    // Направляющие ящиков — показываем только если есть хоть один ящик
    const anyDrawer = state.cells.some(c => c.type === 'drawer' || c.filling === 'drawers');
    if (anyDrawer){
      html.push(`<div class="section-label">Направляющие ящиков</div>`);
      html.push(`<div class="tile-grid cols-2">
        ${Object.entries(CONFIG.slides).map(([k,v]) => `
          <div class="tile ${state.slides===k?'on':''}" data-slides="${k}">
            <div class="tile-label">${v.name}</div>
            <div class="tile-sub">${v.sub} · ${v.price} ₽/шт</div>
          </div>`).join('')}
      </div>`);
    }

    html.push(`<div class="section-label">Опции</div>`);
    html.push(ts('pushOpen', 'Push-to-open', 'Для дверей без ручек'));
    html.push(ts('lighting', 'LED-подсветка', 'С датчиком на дверях'));

    html.push(`<div class="section-label">Кромка</div>`);
    html.push(`<div class="tile-grid cols-3">
      ${[['none','Без кромки','пилёная'],['thin','ПВХ 0.4 мм','стандарт'],['thick','ABS 2 мм','премиум']].map(([k,n,s]) => `
        <div class="tile ${state.edge===k?'on':''}" data-edge="${k}">
          <div class="tile-label">${n}</div>
          <div class="tile-sub">${s}</div>
        </div>`).join('')}
    </div>`);
  }

  if (state.step === 4){
    const p = calcPrice();
    const sh = SHAPES[state.shape];
    const types = {};
    for (const cell of state.cells) types[cell.type] = (types[cell.type] || 0) + 1;

    html.push(`<div class="summary-grid">
      <div class="summary-row"><span>Форма</span><span>${sh.name}${sh.hasWing ? ' (' + sh.sub + ')' : ''}</span></div>
      <div class="summary-row"><span>Размеры</span><span>${state.width}×${state.height}×${state.depth}${sh.hasWing ? ' + крыло ' + state.wingLength : ''}</span></div>
      <div class="summary-row"><span>Сетка</span><span>${state.cols}×${state.rows}</span></div>
      <div class="summary-row"><span>Ячейки</span><span>${Object.entries(types).map(([t,n]) => `${CELL_TYPES[t].name.toLowerCase()}: ${n}`).join(', ')}</span></div>
      <div class="summary-row"><span>Корпус (${CONFIG.materials[state.bodyMaterial].name}, ${COLORS[state.bodyColor].name})</span><span>${fmt(p.body)}</span></div>
      <div class="summary-row"><span>Фасады, фурнитура</span><span>${fmt(p.covers)}</span></div>
      ${p.extras>0?`<div class="summary-row"><span>Доп. опции</span><span>${fmt(p.extras)}</span></div>`:''}
      <div class="summary-row total"><span>Итого</span><span>${fmt(p.total)}</span></div>
    </div>`);

    // === ДЕТАЛИРОВКА МАТЕРИАЛА ===
    {
      const cut = computeCutList();
      const totalEntries = Object.entries(cut.totals);
      html.push(`<div class="section-label" style="margin-top:22px">Расход материала</div>`);
      html.push(`<div class="mat-totals">
        ${totalEntries.map(([k,v]) => `
          <div class="mat-total-row"><span>${k}</span><span><b>${v.toFixed(2)}</b> м²</span></div>
        `).join('')}
      </div>`);
      html.push(`<details class="spec-details" style="margin-top:10px">
        <summary>Список деталей (${cut.parts.length})</summary>
        <div class="spec-table">
          <div class="spec-row spec-head"><span>Деталь</span><span>Материал</span><span>Размер, мм</span><span>Кол</span></div>
          ${cut.parts.map(pt => `
            <div class="spec-row">
              <span>${pt.name}</span>
              <span>${pt.material} ${pt.thick}мм</span>
              <span>${pt.w}×${pt.h}</span>
              <span>${pt.qty}</span>
            </div>`).join('')}
        </div>
      </details>`);
      html.push(`<button class="bulk-btn" id="export-spec" style="width:100%; margin-top:10px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:14px;height:14px;vertical-align:middle;margin-right:6px"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
        Скачать спецификацию (Excel)
      </button>`);
    }
    html.push(`<div class="field"><input type="text" class="form-input" id="cust-name" placeholder="Ваше имя" value="${escapeHtml(state.customer.name)}"></div>`);
    html.push(`<div class="field"><input type="tel" class="form-input" id="cust-phone" placeholder="+7 ___ ___ __ __" value="${escapeHtml(state.customer.phone)}"></div>`);
    html.push(`<div class="field">
      <label class="comment-label">Особые пожелания <span style="color:var(--text-3);font-weight:400">(необязательно)</span></label>
      <details class="comment-hint">
        <summary>Подсказки по типовым ситуациям</summary>
        <ul>
          <li>Будет использоваться на улице или на балконе</li>
          <li>Шкаф впритык к стене слева или справа</li>
          <li>Влажное помещение (ванная, прачечная)</li>
          <li>Будет подвешен, а не стоять на полу</li>
          <li>Уже есть мебель — нужно «попасть в материал»</li>
          <li>Нестандартный потолок (наклон, балка)</li>
        </ul>
      </details>
      <textarea class="form-input" id="cust-comment" placeholder="Например: шкаф под потолок 2520, слева труба, нужны подсверления под навеску..." rows="3" style="resize:vertical;min-height:80px;font-family:inherit;margin-top:6px">${escapeHtml(state.customer.comment || '')}</textarea>
    </div>`);
    html.push(`<button class="bulk-btn" id="copy-summary-btn" style="margin-top:4px;display:flex;gap:6px;align-items:center;width:auto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      Скопировать конфигурацию в текст
    </button>`);
  }

  body.innerHTML = html.join('');
  body.classList.remove('fade-in');
  void body.offsetWidth;
  body.classList.add('fade-in');
  attachStepHandlers();
  setTimeout(updateAllSliderTracks, 30);
}

function sliderField(label, key, min, max, step, unit){
  return `<div class="field">
    <div class="field-label">
      <span>${label}</span>
      <span class="field-num-wrap">
        <input type="number" class="field-num" data-slider-num="${key}"
          min="${min}" max="${max}" step="${step}" value="${state[key]}">
        <span class="field-num-unit">${unit}</span>
      </span>
    </div>
    <div class="slider-block">
      <div class="slider-rail">
        <div class="slider-fill" data-slider-fill="${key}"></div>
        <div class="slider-pill" data-slider-pill="${key}"><span id="hn-${key}">${state[key]}</span></div>
      </div>
      <input type="range" data-slider="${key}" data-unit="${unit}" min="${min}" max="${max}" step="${step}" value="${state[key]}">
    </div>
  </div>`;
}

function updateAllSliderTracks(){
  document.querySelectorAll('[data-slider]').forEach(updateSliderTrack);
}

function updateSliderTrack(input){
  const key = input.dataset.slider;
  const min = parseFloat(input.min), max = parseFloat(input.max);
  const val = parseFloat(input.value);
  const pct = (val - min) / (max - min);
  const fill = document.querySelector(`[data-slider-fill="${key}"]`);
  const pill = document.querySelector(`[data-slider-pill="${key}"]`);
  if (fill) fill.style.width = (pct * 100) + '%';
  if (pill) pill.style.left = (pct * 100) + '%';
  const hn = document.getElementById('hn-' + key);
  if (hn) hn.textContent = val;
}

function attachStepHandlers(){
  document.querySelectorAll('[data-slider]').forEach(el => {
    updateSliderTrack(el);
    el.addEventListener('input', e => {
      state[e.target.dataset.slider] = parseInt(e.target.value);
      updateSliderTrack(e.target);
      // Синхронизируем числовое поле
      const num = document.querySelector(`[data-slider-num="${e.target.dataset.slider}"]`);
      if (num) num.value = e.target.value;
      scheduleBuildDebounced();
      renderUIThrottled();
    });
    // При отпускании ползунка — гарантированно строим сразу (если debounce ещё ждёт)
    el.addEventListener('change', () => {
      if (buildDebounceTimer){ clearTimeout(buildDebounceTimer); buildDebounceTimer = null; }
      scheduleBuild();
    });
  });
  // Числовые поля рядом со слайдерами — точный ввод значения
  document.querySelectorAll('[data-slider-num]').forEach(el => {
    const apply = () => {
      const key = el.dataset.sliderNum;
      const min = parseFloat(el.min), max = parseFloat(el.max);
      let v = parseInt(el.value);
      if (isNaN(v)) return;
      v = Math.max(min, Math.min(max, v)); // в пределах диапазона
      state[key] = v;
      el.value = v;
      const range = document.querySelector(`[data-slider="${key}"]`);
      if (range){ range.value = v; updateSliderTrack(range); }
      scheduleBuild();
      renderUIThrottled();
    };
    el.addEventListener('change', apply);
    // Enter подтверждает ввод
    el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); apply(); el.blur(); } });
  });
  document.querySelectorAll('[data-grid-set]').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.dataset.gridSet;
      const val = parseInt(el.dataset.gridVal);
      if (key === 'cols') reshapeCells(val, state.rows);
      else if (key === 'rows') reshapeCells(state.cols, val);
      else if (key === 'wingRows'){
        // Меняем число секций крыла: подгоняем массив wingCells, наполнение пустое
        state.wingRows = val;
        while (state.wingCells.length < val){
          state.wingCells.push({ type:'door', side:'left', color:null, filling:'rod' });
        }
        state.wingCells.length = val;
        // Если редактировалась секция за пределами — сбросить выбор
        if (isWingId(state.editingCell) && wingRowOf(state.editingCell) >= val){
          state.editingCell = state.step === 2 ? 'wing0' : -1;
        }
        scheduleBuild();
        renderUI();
        return;
      }
      // При изменении структуры основной сетки наполнение всех ячеек сбрасывается к простому —
      // менеджер всё равно настраивает секции заново, и ничего «случайного» (ящиков из
      // прошлой раскладки) не остаётся
      for (const c of state.cells){
        c.type = 'door';
        c.filling = 'empty';
        delete c.stack;
      }
      scheduleBuild();
      renderUI();
    });
  });
  document.querySelectorAll('[data-bodymaterial]').forEach(el => {
    el.addEventListener('click', () => { state.bodyMaterial = el.dataset.bodymaterial; scheduleBuild(); renderUI(); });
  });
  document.querySelectorAll('[data-facadematerial]').forEach(el => {
    el.addEventListener('click', () => { state.facadeMaterial = el.dataset.facadematerial; scheduleBuild(); renderUI(); });
  });
  document.querySelectorAll('[data-bodycolor]').forEach(el => {
    el.addEventListener('click', () => { state.bodyColor = el.dataset.bodycolor; scheduleBuild(); renderUI(); });
  });
  document.querySelectorAll('[data-doorcolor], [data-defaultdoorcolor]').forEach(el => {
    el.addEventListener('click', () => {
      state.defaultDoorColor = el.dataset.doorcolor || el.dataset.defaultdoorcolor;
      scheduleBuild(); renderUI();
    });
  });
  document.querySelectorAll('[data-shape]').forEach(el => {
    el.addEventListener('click', () => {
      if (state.shape !== el.dataset.shape){
        state.shape = el.dataset.shape;
        nextBuildShouldFit = true;
        // Если крыло было в редактировании, но новая форма без крыла — сбрасываем
        if (isWingId(state.editingCell) && !SHAPES[state.shape].hasWing){
          state.editingCell = state.step === 2 ? 0 : -1;
        }
      }
      scheduleBuild();
      renderUI();
    });
  });
  document.querySelectorAll('[data-handle]').forEach(el => {
    el.addEventListener('click', () => {
      state.defaultHandle = el.dataset.handle;
      if (state.defaultHandle === 'push') state.pushOpen = true;
      scheduleBuild(); renderUI();
    });
  });
  document.querySelectorAll('[data-hinges]').forEach(el => {
    el.addEventListener('click', () => { state.hinges = el.dataset.hinges; renderUI(); });
  });
  document.querySelectorAll('[data-slides]').forEach(el => {
    el.addEventListener('click', () => { state.slides = el.dataset.slides; renderUI(); });
  });
  document.querySelectorAll('[data-backwall]').forEach(el => {
    el.addEventListener('click', () => { state.backWall = el.dataset.backwall; scheduleBuild(); renderUI(); });
  });
  document.querySelectorAll('[data-socket]').forEach(el => {
    el.addEventListener('click', () => { state.socket = parseInt(el.dataset.socket); scheduleBuild(); renderUI(); });
  });
  document.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => { state[el.dataset.toggle] = !state[el.dataset.toggle]; scheduleBuild(); renderUI(); });
  });
  document.querySelectorAll('[data-edge]').forEach(el => {
    el.addEventListener('click', () => { state.edge = el.dataset.edge; renderUI(); });
  });
  document.querySelectorAll('[data-bulk]').forEach(el => {
    el.addEventListener('click', () => {
      const b = el.dataset.bulk;
      // Меняем только ТИП фасада; наполнение и цвет ячеек сохраняем — ничего случайного
      for (let i = 0; i < state.cells.length; i++){
        const c = state.cells[i];
        const col = i % state.cols;
        state.cells[i] = {
          type: b,
          side: c.side && c.side !== 'auto' ? c.side : (col < state.cols/2 ? 'left' : 'right'),
          color: c.color || null,
          filling: c.filling && c.filling !== 'auto' ? c.filling : 'shelves',
          ...(c.stack ? { stack: c.stack } : {})
        };
      }
      scheduleBuild(); renderUI();
    });
  });
  document.querySelectorAll('[data-column-preset]').forEach(el => {
    el.addEventListener('click', () => {
      applyPresetToAllColumns(el.dataset.columnPreset);
    });
  });

  const nameEl = document.getElementById('cust-name');
  const phoneEl = document.getElementById('cust-phone');
  const commentEl = document.getElementById('cust-comment');

  // Кнопка «Скачать спецификацию (Excel)»
  const exportSpecBtn = document.getElementById('export-spec');
  if (exportSpecBtn){
    exportSpecBtn.addEventListener('click', () => exportSpecToExcel());
  }
  if (nameEl) nameEl.addEventListener('input', e => { state.customer.name = e.target.value; saveStateToStorage(); });
  if (phoneEl) phoneEl.addEventListener('input', e => {
    const cursorPos = e.target.selectionStart;
    const oldVal = e.target.value;
    const formatted = formatPhone(e.target.value);
    state.customer.phone = formatted;
    e.target.value = formatted;
    // Try to preserve cursor position when typing forward
    const diff = formatted.length - oldVal.length;
    if (diff >= 0 && cursorPos !== null) {
      const newPos = Math.min(formatted.length, cursorPos + diff);
      try { e.target.setSelectionRange(newPos, newPos); } catch(err){}
    }
    saveStateToStorage();
  });
  if (commentEl) commentEl.addEventListener('input', e => { state.customer.comment = e.target.value; saveStateToStorage(); });

  const copyBtn = document.getElementById('copy-summary-btn');
  if (copyBtn) copyBtn.addEventListener('click', () => {
    const text = buildSummaryText();
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.textContent = '✓ Скопировано';
        setTimeout(() => { renderUI(); }, 1500);
      });
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(ta);
      copyBtn.textContent = '✓ Скопировано';
      setTimeout(() => { renderUI(); }, 1500);
    }
  });
}

let renderTimer = null;
function renderUIThrottled(){
  if (renderTimer) return;
  renderTimer = setTimeout(() => {
    renderTimer = null;
    const price = calcPrice();
    document.getElementById('price-val').textContent = fmt(price.total);
    saveStateToStorage();
  }, 60);
}

function submitOrder(){
  const p = calcPrice();
  const types = {};
  for (const cell of state.cells) types[cell.type] = (types[cell.type] || 0) + 1;
  const hasWing = SHAPES[state.shape].hasWing;
  const payload = {
    timestamp: new Date().toISOString(),
    source: 'wardrobe-configurator-v62',
    customer: state.customer,
    config: {
      shape: SHAPES[state.shape].name + (hasWing ? ' (' + SHAPES[state.shape].sub + ')' : ''),
      dimensions: `${state.width}×${state.height}×${state.depth}`,
      wing: hasWing ? `${state.wingLength} мм` : null,
      grid: `${state.cols}×${state.rows}`,
      cellBreakdown: Object.entries(types).map(([t,n]) => `${CELL_TYPES[t].name}: ${n}`).join(', '),
      bodyMaterial: CONFIG.materials[state.bodyMaterial].name,
      facadeMaterial: CONFIG.materials[state.facadeMaterial].name,
      bodyColor: COLORS[state.bodyColor].name,
      defaultDoorColor: COLORS[state.defaultDoorColor].name,
      backWall: (CONFIG.backWalls[state.backWall] || CONFIG.backWalls.hdf_white).name,
      handles: HANDLES[state.defaultHandle].name,
      hinges: CONFIG.hinges[state.hinges].name,
      slides: CONFIG.slides[state.slides] ? CONFIG.slides[state.slides].name : '—',
      socket: state.socket,
      antresol: state.antresol ? `${state.antresolH} мм` : 'нет',
      pushOpen: state.pushOpen,
      lighting: state.lighting,
      edge: state.edge === 'none' ? 'без кромки' : state.edge === 'thin' ? 'ПВХ 0.4 мм' : 'ABS 2 мм',
      cells: state.cells.map((c, i) => {
        const gridHmm_p = state.height - state.socket - (state.antresol ? state.antresolH : 0) - 32;
        const cellHmm_p = Math.round(gridHmm_p / state.rows);
        let fillingStr;
        if (c.type === 'drawer') fillingStr = '—';
        else if (c.filling === 'custom' && Array.isArray(c.stack)){
          // Своя комбинация: зоны с фактическими высотами, снизу вверх
          fillingStr = computeStackZones(c.stack, cellHmm_p)
            .map(z => `${zoneName(z.f).toLowerCase()} ${z.topMm - z.bottomMm}мм`)
            .join(' + ');
        } else fillingStr = (FILLINGS[c.filling] && FILLINGS[c.filling].name) || c.filling;
        return {
          position: `${Math.floor(i/state.cols)+1}.${i%state.cols+1}`,
          type: CELL_TYPES[c.type].name,
          filling: fillingStr,
          side: c.side,
          color: c.color ? COLORS[c.color].name : 'как корпус'
        };
      }),
      wingSections: hasWing ? state.wingCells.map((wc, i) => ({
        section: (state.wingRows - i) + '',
        type: CELL_TYPES[wc.type].name,
        filling: wc.type === 'drawer' ? '—' : fillingDisplayName(wc, (state.height - state.socket - (state.antresol ? state.antresolH : 0) - 32) / (state.wingRows || 1)),
        side: wc.side,
        color: wc.color ? COLORS[wc.color].name : 'как корпус'
      })) : null
    },
    price: p,
    summary: buildSummaryText()
  };

  // Backend integration — set window.ARSI_BACKEND_URL on the page to enable POST
  const backendUrl = window.ARSI_BACKEND_URL;
  const btnNext = document.getElementById('btn-next');
  const origLabel = btnNext.innerHTML;

  if (backendUrl){
    btnNext.disabled = true;
    btnNext.innerHTML = 'Отправляем…';
    fetch(backendUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(res => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json().catch(()=>({}));
    }).then(data => {
      btnNext.innerHTML = '✓ Отправлено';
      alert('Заявка отправлена. Менеджер свяжется в течение часа.');
      setTimeout(() => { btnNext.disabled = false; btnNext.innerHTML = origLabel; }, 2000);
    }).catch(err => {
      console.error('ARSI submit error:', err, payload);
      btnNext.disabled = false;
      btnNext.innerHTML = origLabel;
      alert('Не удалось отправить заявку: ' + err.message + '\nПопробуйте ещё раз или позвоните нам напрямую.');
    });
  } else {
    console.log('ARSI ORDER PAYLOAD (no backend configured):', payload);
    alert('Заявка готова. Конфигурация в консоли (F12).\n\nДля отправки на сервер задайте window.ARSI_BACKEND_URL на странице.');
  }
}

function isWingId(id){
  return typeof id === 'string' && id.indexOf('wing') === 0;
}
function wingRowOf(id){
  if (!isWingId(id)) return 0;
  const n = parseInt(id.slice(4));
  return isNaN(n) ? 0 : n;
}
function wingCellOf(id){
  return state.wingCells[wingRowOf(id)] || state.wingCells[0];
}

function isEditingCell(){
  return isWingId(state.editingCell) || (typeof state.editingCell === 'number' && state.editingCell >= 0);
}

function gotoStep(newStep){
  if (newStep === 2){
    if (!isEditingCell()) state.editingCell = 0;
    // Авто-xray на шаге 2 — видеть наполнение во время настройки
    if (state.view !== 'xray'){
      _viewBeforeEdit = state.view;
      state.view = 'xray';
      applyViewMode();
    }
  } else {
    if (isEditingCell()) state.editingCell = -1;
    // Восстановить вид при выходе из шага 2 (если был сохранён)
    if (_viewBeforeEdit !== null){
      state.view = _viewBeforeEdit;
      _viewBeforeEdit = null;
      applyViewMode();
    }
  }
  state.step = newStep;
  updateCellHighlight();
  renderUI();
}

document.getElementById('btn-next').addEventListener('click', () => {
  if (isEditingCell() && state.step !== 2){ closeCellEditor(); return; }
  if (state.step < 4){ gotoStep(state.step + 1); }
  else {
    if (!state.customer.name || state.customer.name.trim().length < 2){
      alert('Укажите имя');
      const el = document.getElementById('cust-name');
      if (el) el.focus();
      return;
    }
    if (!isPhoneValid(state.customer.phone)){
      alert('Укажите телефон в формате +7 (XXX) XXX-XX-XX');
      const el = document.getElementById('cust-phone');
      if (el) el.focus();
      return;
    }
    submitOrder();
  }
});
document.getElementById('btn-prev').addEventListener('click', () => {
  if (isEditingCell() && state.step !== 2){ closeCellEditor(); return; }
  if (state.step > 1){ gotoStep(state.step - 1); }
});
document.getElementById('head-close').addEventListener('click', closeCellEditor);
document.getElementById('head-reset').addEventListener('click', () => {
  if (confirm('Сбросить все настройки и начать заново?')) resetState();
});
document.querySelectorAll('.step-pill').forEach(p => {
  p.addEventListener('click', () => {
    gotoStep(parseInt(p.dataset.step));
  });
});
document.querySelectorAll('.vbtn').forEach(b => {
  b.addEventListener('click', () => {
    state.view = b.dataset.view;
    _viewBeforeEdit = null; // Если пользователь сам переключил — отменяем авто-восстановление
    applyViewMode();
    renderUI();
  });
});
document.getElementById('btn-dims').addEventListener('click', () => {
  state.showDims = !state.showDims;
  dimsDirty = true;
  renderUI();
});
document.getElementById('btn-rotate').addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  controls.autoRotateSpeed = 1.2;
  document.getElementById('btn-rotate').classList.toggle('on', controls.autoRotate);
});
document.getElementById('btn-reset').addEventListener('click', () => {
  // Плавный возврат камеры — анимация ~0.5 сек, ease-in-out
  targetCameraDist = null;
  cameraAnim = {
    camFrom: camera.position.clone(),
    camTo: new THREE.Vector3(3.5, 2.5, 3.5),
    tgtFrom: controls.target.clone(),
    tgtTo: new THREE.Vector3(0, 1.1, -1),
    t: 0,
    // 30 кадров ≈ 0.5 сек при 60fps
    step: 1/30
  };
  dimsDirty = true;
});
document.getElementById('btn-zoom-in').addEventListener('click', () => zoomBy(0.88));
document.getElementById('btn-zoom-out').addEventListener('click', () => zoomBy(1.14));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (isEditingCell()) closeCellEditor(); }
  const inInput = document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA');
  if (inInput) return;
  if (isEditingCell()) return;
  if (e.key === 'ArrowRight' && state.step < 4){ gotoStep(state.step+1) }
  if (e.key === 'ArrowLeft' && state.step > 1){ gotoStep(state.step-1) }
  if (e.key === 'Enter'){
    if (state.step < 4){ gotoStep(state.step+1) }
  }
});

initThree();
renderUI();
</script>
