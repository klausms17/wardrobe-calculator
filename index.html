            // Дверной сегмент — своя дверь с петлями и ручкой
            let opensLeftSeg;
            if (cell.side === 'left') opensLeftSeg = false;
            else if (cell.side === 'right') opensLeftSeg = true;
            else opensLeftSeg = c < state.cols / 2;

            const pivotXSeg = opensLeftSeg ? fCx - fW/2 + doorGap : fCx + fW/2 - doorGap;
            const dGroup = new THREE.Group();
            dGroup.position.set(pivotXSeg, fCy, facadeOffsetZ + 0.009);
            dGroup.userData.opensLeft = opensLeftSeg;
            dGroup.userData.cellIndex = idx;

            const dMesh = new THREE.Mesh(new THREE.BoxGeometry(fW, fH, 0.018), coverMat);
            dMesh.position.x = opensLeftSeg ? fW/2 : -fW/2;
            dMesh.castShadow = true; dMesh.receiveShadow = true;
            dGroup.add(dMesh);

            if (state.defaultHandle !== 'push'){
              addHandle(dGroup, fW, fH, opensLeftSeg);
            }
            wardrobe.add(dGroup);
            wardrobeRefs.covers.push(dGroup);
            animState.coverTargets.set(dGroup, { type:'door', value:0 });
          }
        }
        continue;
      }

      // Накладные двери: перекрывают торцы внешних стенок и пола/потолка
      // если ячейка крайняя — её фасад выходит за пределы внутренней ширины
      let doorExtLeft = 0, doorExtRight = 0, doorExtTop = 0, doorExtBottom = 0;
      if (c === 0) doorExtLeft = T - doorGap;
      if (c === state.cols - 1) doorExtRight = T - doorGap;
      if (r === 0) doorExtTop = T - doorGap;
      if (r === state.rows - 1 && !state.antresol) doorExtBottom = T - doorGap;
      const finalDoorW = dWidth + doorExtLeft + doorExtRight;
      const finalDoorH = dHeight + doorExtTop + doorExtBottom;
      const finalDoorCx = cellCx + (doorExtRight - doorExtLeft) / 2;
      const finalDoorCy = cellCy + (doorExtTop - doorExtBottom) / 2;

      let opensLeft;
      if (cell.side === 'left') opensLeft = false;
      else if (cell.side === 'right') opensLeft = true;
      else opensLeft = c < state.cols / 2;

      const pivotX = opensLeft ? finalDoorCx - finalDoorW/2 + doorGap : finalDoorCx + finalDoorW/2 - doorGap;

      // Дверь без отдельного shadow-plane — один общий тёмный backplate за ВСЕМИ дверями
      // создаст тонкие тёмные швы в зазорах естественным образом (см. ниже после всех cells)
      const doorGroup = new THREE.Group();
      doorGroup.position.set(pivotX, finalDoorCy, facadeOffsetZ + 0.009);
      doorGroup.userData.opensLeft = opensLeft;
      doorGroup.userData.cellIndex = idx;

      const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(finalDoorW, finalDoorH, 0.018), coverMat);
      doorMesh.position.x = opensLeft ? finalDoorW/2 : -finalDoorW/2;
      doorMesh.castShadow = true;
      doorMesh.receiveShadow = true;
      doorGroup.add(doorMesh);

      // Тонкая металлическая рамка для стеклянной двери
      if (cell.type === 'glass'){
        const frameMat = new THREE.MeshStandardMaterial({ color:0x2A2825, roughness:0.4, metalness:0.85 });
        const frameThick = 0.018;
        const frameW = 0.012;
        const topFrame = new THREE.Mesh(new THREE.BoxGeometry(finalDoorW, frameW, frameThick+0.001), frameMat);
        topFrame.position.set(doorMesh.position.x, finalDoorH/2 - frameW/2, 0.001);
        doorGroup.add(topFrame);
        const botFrame = topFrame.clone();
        botFrame.position.y = -finalDoorH/2 + frameW/2;
        doorGroup.add(botFrame);
        const leftFrame = new THREE.Mesh(new THREE.BoxGeometry(frameW, finalDoorH, frameThick+0.001), frameMat);
        leftFrame.position.set(doorMesh.position.x - finalDoorW/2 + frameW/2, 0, 0.001);
        doorGroup.add(leftFrame);
        const rightFrame = leftFrame.clone();
        rightFrame.position.x = doorMesh.position.x + finalDoorW/2 - frameW/2;
        doorGroup.add(rightFrame);
      }

      if (state.defaultHandle !== 'push'){
        addHandle(doorGroup, finalDoorW, finalDoorH, opensLeft);
      }

      wardrobe.add(doorGroup);
      wardrobeRefs.covers.push(doorGroup);
      animState.coverTargets.set(doorGroup, { type:'door', value:0 });
    }
  }

  if (shape.hasWing){
    const wingSides = shape.wingSides || [shape.wingSide];
    for (const _side of wingSides){
    const wingLen = state.wingLength / 1000;
    const wingGroup = new THREE.Group();

    const isLeft = _side === 'left';
    const wingCenterX = isLeft ? -W/2 - D/2 - 0.005 : W/2 + D/2 + 0.005;
    const wingCenterZ = -D/2 + wingLen/2;

    if (socketH > 0){
      const wsocket = new THREE.Mesh(new THREE.BoxGeometry(D - 0.04, socketH, wingLen - 0.04), bodyMat);
      wsocket.position.set(0, socketH/2, 0);
      wsocket.castShadow = true; wsocket.receiveShadow = true;
      wingGroup.add(wsocket);
    }

    const wsideGeo = new THREE.BoxGeometry(D, bodyH, T);
    const wfront = new THREE.Mesh(wsideGeo, bodyMat);
    wfront.position.set(0, bodyY0 + bodyH/2, wingLen/2 - T/2);
    wfront.castShadow = true; wfront.receiveShadow = true;
    wingGroup.add(wfront);

    const wendGeo = new THREE.BoxGeometry(T, bodyH, wingLen);
    const wouter = new THREE.Mesh(wendGeo, bodyMat);
    wouter.position.set(isLeft ? -D/2 + T/2 : D/2 - T/2, bodyY0 + bodyH/2, 0);
    wouter.castShadow = true; wouter.receiveShadow = true;
    wingGroup.add(wouter);

    const wtopGeo = new THREE.BoxGeometry(D, T, wingLen);
    const wtop = new THREE.Mesh(wtopGeo, bodyMat);
    wtop.position.set(0, H - T/2, 0);
    wtop.castShadow = true; wtop.receiveShadow = true;
    wingGroup.add(wtop);
    const wbot = new THREE.Mesh(wtopGeo, bodyMat);
    wbot.position.set(0, bodyY0 + T/2, 0);
    wbot.castShadow = true; wbot.receiveShadow = true;
    wingGroup.add(wbot);

    if (state.backWall && state.backWall !== 'none'){
      const bwCfg2 = CONFIG.backWalls[state.backWall];
      const wbackThick = state.backWall === 'body' ? 0.016 : 0.003;
      let wbackMat;
      if (state.backWall === 'body'){
        wbackMat = bodyMat;
      } else {
        const hex2 = bwCfg2.hex || 0xf5f1e8;
        wbackMat = new THREE.MeshStandardMaterial({ color: hex2, roughness:0.95, metalness:0 });
      }
      const wback = new THREE.Mesh(new THREE.BoxGeometry(D - 2*T, bodyH - T, wbackThick), wbackMat);
      wback.position.set(0, bodyY0 + bodyH/2 - T/2, -wingLen/2 + wbackThick/2);
      wback.receiveShadow = true;
      wingGroup.add(wback);
    }

    // === Угловое крыло — делится на секции по высоте (wingRows), у каждой своя дверь ===
    const wingInnerWidth = D - 2*T;
    const facadeZ = wingLen/2 + 0.014;
    const wGridTop = H - T;            // верх внутреннего пространства крыла
    const wGridBottom = bodyY0 + T;    // низ
    const wGridH = wGridTop - wGridBottom;
    const wRows = state.wingRows || 1;
    const wSecH = wGridH / wRows;      // высота одной секции крыла

    // Горизонтальные перегородки между секциями крыла
    for (let r = 1; r < wRows; r++){
      const y = wGridBottom + wSecH * r;
      const wsh = new THREE.Mesh(new THREE.BoxGeometry(wingInnerWidth, T, wingLen - 2*T), bodyMat);
      wsh.position.set(0, y, 0);
      wsh.castShadow = true; wsh.receiveShadow = true;
      addEdges(wsh);
      wingGroup.add(wsh);
      wardrobeRefs.ldsp.push(wsh);
    }

    for (let wr = 0; wr < wRows; wr++){
      const wing = state.wingCells[wr] || { type:'door', side:'left', color:null, filling:'rod' };
      // Секции нумеруются СНИЗУ ВВЕРХ как в основной части (ряд 0 — верхний)
      const secTopY = wGridTop - wSecH * wr;
      const secBottomY = secTopY - wSecH;
      const wDoorY = (secTopY + secBottomY) / 2;
      const wDoorH = wSecH - doorGap*2;
      const wDoorWidth = wingInnerWidth - doorGap*2;
      const wingId = 'wing' + wr;

      const wingFacadeMat = wing.type === 'mirror'
        ? getMirrorMaterial()
        : wing.type === 'glass'
          ? getGlassMaterial()
          : getMaterial(wing.color || state.defaultDoorColor);

      // Hit zone секции
      const wHitZone = new THREE.Mesh(
        new THREE.PlaneGeometry(wDoorWidth, wDoorH),
        new THREE.MeshBasicMaterial({ visible:false })
      );
      wHitZone.position.set(0, wDoorY, facadeZ + 0.02);
      wHitZone.userData.isWing = true;
      wHitZone.userData.wingRow = wr;
      wHitZone.userData.cellW = wDoorWidth;
      wHitZone.userData.cellH = wDoorH;
      wingGroup.add(wHitZone);
      wardrobeRefs.cellMeshes.push(wHitZone);

      // Наполнение секции
      const wingFillingVisible = wing.type === 'open' || wing.type === 'glass'
        || state.view === 'xray' || state.view === 'open'
        || (wing.type === 'mirror' && state.view !== 'closed');
      if (wingFillingVisible && wing.type !== 'drawer'){
        const effectiveFilling = (wing.filling === 'auto' || !wing.filling)
          ? (wSecH > 1.5 ? 'rod_shelf' : wSecH > 0.9 ? 'rod' : 'shelves')
          : wing.filling;
        drawCellFilling(effectiveFilling, 0, wDoorY, wingInnerWidth, wSecH, wingLen, bodyMat, wingGroup, wing.stack);
      }

      // Вертикальные расширения накладного фасада только у крайних секций
      const wExtT = (wr === 0) ? T - doorGap : 0;
      const wExtB = (wr === wRows - 1 && socketH <= 0) ? T - doorGap : 0;

      if (wing.type === 'drawer'){
        const drW = wDoorWidth + (T - doorGap) * 2;
        const drH = wDoorH + wExtT + wExtB;
        const drCy = wDoorY + (wExtT - wExtB) / 2;
        const drFront = new THREE.Mesh(new THREE.BoxGeometry(drW, drH, 0.018), wingFacadeMat);
        drFront.position.set(0, drCy, facadeZ);
        drFront.castShadow = true; drFront.receiveShadow = true;
        drFront.userData.isWingFront = true;
        drFront.userData.basePos = drFront.position.clone();
        wingGroup.add(drFront);
        wardrobeRefs.covers.push(drFront);
        animState.coverTargets.set(drFront, { type:'drawer', value:0 });

        const handle = new THREE.Mesh(
          new THREE.BoxGeometry(drW * 0.4, 0.008, 0.012),
          new THREE.MeshStandardMaterial({ color:0x2A2825, roughness:0.4, metalness:0.85 })
        );
        handle.position.set(0, drCy, facadeZ + 0.013);
        handle.userData.isDrawerHandle = true;
        handle.userData.parent = drFront;
        wingGroup.add(handle);
        wardrobeRefs.covers.push(handle);
      } else if (wing.type !== 'open') {
        const finalW = wDoorWidth + (T - doorGap) * 2;
        const finalH = wDoorH + wExtT + wExtB;
        const finalCy = wDoorY + (wExtT - wExtB) / 2;

        let opensLeftWing;
        if (wing.side === 'left') opensLeftWing = false;
        else if (wing.side === 'right') opensLeftWing = true;
        else opensLeftWing = isLeft;

        const pivotXLocal = opensLeftWing ? -finalW/2 + doorGap : finalW/2 - doorGap;
        const wDoorGroup = new THREE.Group();
        wDoorGroup.position.set(pivotXLocal, finalCy, facadeZ);
        wDoorGroup.userData.opensLeft = opensLeftWing;
        wDoorGroup.userData.isWingDoor = true;
        wDoorGroup.userData.isWingFront = true;

        const wDoorMesh = new THREE.Mesh(new THREE.BoxGeometry(finalW, finalH, 0.018), wingFacadeMat);
        wDoorMesh.position.x = opensLeftWing ? finalW/2 : -finalW/2;
        wDoorMesh.castShadow = true; wDoorMesh.receiveShadow = true;
        wDoorGroup.add(wDoorMesh);

        if (wing.type === 'glass'){
          const frameMat = new THREE.MeshStandardMaterial({ color:0x2A2825, roughness:0.4, metalness:0.85 });
          const fw = 0.012;
          const topF = new THREE.Mesh(new THREE.BoxGeometry(finalW, fw, 0.019), frameMat);
          topF.position.set(wDoorMesh.position.x, finalH/2 - fw/2, 0.001);
          wDoorGroup.add(topF);
          const botF = topF.clone(); botF.position.y = -finalH/2 + fw/2; wDoorGroup.add(botF);
          const lF = new THREE.Mesh(new THREE.BoxGeometry(fw, finalH, 0.019), frameMat);
          lF.position.set(wDoorMesh.position.x - finalW/2 + fw/2, 0, 0.001);
          wDoorGroup.add(lF);
          const rF = lF.clone(); rF.position.x = wDoorMesh.position.x + finalW/2 - fw/2; wDoorGroup.add(rF);
        }

        if (state.defaultHandle !== 'push'){
          addHandle(wDoorGroup, finalW, finalH, opensLeftWing);
        }

        wingGroup.add(wDoorGroup);
        wardrobeRefs.covers.push(wDoorGroup);
        animState.coverTargets.set(wDoorGroup, { type:'door', value:0 });
      }
    }

    wingGroup.position.set(wingCenterX, 0, wingCenterZ);
    wardrobe.add(wingGroup);
    wardrobeRefs.wingGroup = wingGroup;
    } // конец цикла по сторонам крыла (П-образный = два крыла)
  }

  // Backplates убраны — OutlinePass рисует тонкие линии по силуэту каждой двери,
  // зазоры между дверями получают двойной outline (правая первой + левая второй) = тонкий шов.

  wardrobeRefs.body = wardrobe;
  const fitNeeded = isFirstBuild || nextBuildShouldFit;
  if (isFirstBuild){
    animState.buildScale = 0;
    wardrobe.scale.set(1, 0.01, 1);
    isFirstBuild = false;
  } else {
    animState.buildScale = 1;
    wardrobe.scale.set(1, 1, 1);
  }
  wardrobe.position.set(0, 0, -2.5 + D/2 + 0.015);
  scene.add(wardrobe);
  // Шкаф перестроен — пересчитать тени один раз (autoUpdate выключен для производительности)
  if (renderer && renderer.shadowMap) renderer.shadowMap.needsUpdate = true;

  if (fitNeeded){
    autoFitCamera(W, H, D, shape);
    nextBuildShouldFit = false;
  }

  if (scaleFigure){
    if (shape.hasWing && shape.wingSide === 'left'){
      scaleFigure.position.x = -W/2 - D - state.wingLength/1000 + 0.3;
    } else {
      scaleFigure.position.x = -W/2 - 0.55;
    }
  }

  updateCellHighlight();
  applyViewMode();
  dimsDirty = true;

  // Outline только на ФАСАДЫ (двери/ящики/крыло) — это видимая «лицевая» графика.
  // Внутренние полки/перегородки очерчены лёгкими edge-линиями (addEdges) — рендерить
  // их все в outline-маску в 4-5 раз дороже без видимой пользы.
  if (outlinePass){
    const outlineTargets = [];
    if (wardrobeRefs.covers){
      for (const c of wardrobeRefs.covers){
        if (c.userData.isDoorShadow) continue;
        if (c.userData.isDrawerHandle) continue;
        outlineTargets.push(c);
      }
    }
    outlinePass.selectedObjects = outlineTargets;
  }
}

function autoFitCamera(W, H, D, shape){
  if (!camera || !controls) return;
  targetCameraDist = null;
  const wingLen = shape.hasWing ? state.wingLength/1000 : 0;
  const sides = shape.wingSides || (shape.wingSide ? [shape.wingSide] : []);
  const twoWings = sides.length >= 2;
  // Ширина сцены: одно крыло добавляет D с одной стороны, два крыла — с обеих
  const totalX = twoWings ? W + 2*D : (shape.hasWing ? W + D : W);
  let targetX = 0;
  if (shape.hasWing && !twoWings){
    targetX = sides[0] === 'left' ? -D/2 : D/2;  // одно крыло — смещаем центр к нему
  }
  const targetY = H * 0.5;
  const totalZ = shape.hasWing ? Math.max(D, wingLen) : D;
  const targetZ = -2.5 + totalZ / 2;
  controls.target.set(targetX, targetY, targetZ);
  const fov = camera.fov * Math.PI / 180;
  // Запас 1.4 от диагонали — даёт «воздух» вокруг шкафа, виден целиком
  const sceneDiagonal = Math.max(totalX, H * 1.1, totalZ) * 1.4;
  const desiredDist = Math.max(3.5, (sceneDiagonal / 2) / Math.tan(fov / 2));
  const currentDist = camera.position.distanceTo(controls.target);
  if (Math.abs(currentDist - desiredDist) > 0.3){
    const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
    // если позиция камеры близка к target (или совпадает) — взять стандартное направление
    if (dir.lengthSq() < 0.01) dir.set(0.7, 0.4, 0.7).normalize();
    camera.position.copy(controls.target).addScaledVector(dir, desiredDist);
  }
  controls.update();
}

function addHandle(parent, doorW, doorH, opensLeft){
  const handleMat = new THREE.MeshStandardMaterial({ color:0x2A2825, roughness:0.4, metalness:0.85 });
  const handleX = opensLeft ? doorW - 0.04 : -doorW + 0.04;

  if (state.defaultHandle === 'classic'){
    const grp = new THREE.Group();
    const tubeLen = Math.min(doorH * 0.4, 0.19);
    const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, tubeLen, 12), handleMat);
    tube.position.set(0, 0, 0.018);
    grp.add(tube);
    const cap1 = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.022, 12), handleMat);
    cap1.rotation.x = Math.PI/2;
    cap1.position.set(0, tubeLen/2, 0.007);
    grp.add(cap1);
    const cap2 = cap1.clone();
    cap2.position.y = -tubeLen/2;
    grp.add(cap2);
    grp.position.set(handleX, 0, 0.014);
    parent.add(grp);
  } else if (state.defaultHandle === 'knob'){
    const knob = new THREE.Mesh(
      new THREE.SphereGeometry(0.012, 16, 12),
      new THREE.MeshStandardMaterial({ color:0xc9a565, roughness:0.3, metalness:1 })
    );
    knob.position.set(handleX, 0, 0.018);
    parent.add(knob);
  } else if (state.defaultHandle === 'profile'){
    const groove = new THREE.Mesh(
      new THREE.BoxGeometry(doorW - 0.02, 0.018, 0.005),
      new THREE.MeshStandardMaterial({ color:0x1A1816, roughness:0.6, metalness:0.4 })
    );
    const y = doorH/2 - 0.012;
    const x = opensLeft ? doorW/2 : -doorW/2;
    groove.position.set(x, y, 0.018);
    parent.add(groove);
  }
}

function updateCellHighlight(){
  needsRender = true;
  if (!cellHighlight) return;
  const edges = cellHighlight.userData.edges;
  let hit = null;
  if (isWingId(state.editingCell)){
    const _wr = wingRowOf(state.editingCell);
    hit = wardrobeRefs.cellMeshes.find(m => m.userData.isWing && (m.userData.wingRow || 0) === _wr);
  } else if (typeof state.editingCell === 'number' && state.editingCell >= 0 && state.editingCell < wardrobeRefs.cellMeshes.length){
    hit = wardrobeRefs.cellMeshes[state.editingCell];
    if (hit && hit.userData.isWing) hit = null;
  }
  if (!hit) {
    cellHighlight.visible = false;
    if (edges) edges.visible = false;
    return;
  }
  const wpos = new THREE.Vector3();
  hit.getWorldPosition(wpos);

  if (hit.userData.isWing){
    cellHighlight.scale.set(hit.userData.cellW / 0.3 * 0.94, hit.userData.cellH / 0.3 * 0.96, 0.02 / 0.3);
    const isLeft = SHAPES[state.shape].wingSide === 'left';
    cellHighlight.position.set(wpos.x, wpos.y, wpos.z);
    cellHighlight.rotation.y = isLeft ? -Math.PI/2 : Math.PI/2;
    cellHighlight.position.x += isLeft ? -0.025 : 0.025;
  } else {
    const colCenterY = hit.userData.colCenterY;
    const colHeight = hit.userData.colHeight;
    const innerDepth = hit.userData.innerDepth || 0.45; // вся внутренняя глубина без множителя
    const innerW = hit.userData.cellW - 0.020;
    cellHighlight.scale.set(innerW / 0.3, colHeight / 0.3 * 0.97, innerDepth / 0.3);
    const wardrobeZ = wardrobe ? wardrobe.position.z : 0;
    cellHighlight.position.set(wpos.x, colCenterY, wardrobeZ);
    cellHighlight.rotation.y = 0;
  }
  cellHighlight.visible = true;
  if (edges){
    edges.position.copy(cellHighlight.position);
    edges.scale.copy(cellHighlight.scale);
    edges.rotation.copy(cellHighlight.rotation);
    edges.visible = true;
  }
}

function applyViewMode(){
  needsRender = true;
  const isOpen = state.view === 'open';
  const isXray = state.view === 'xray';
  animState.coverTargets.forEach((info, cover) => {
    if (info.type === 'door'){
      const opensLeft = cover.userData.opensLeft;
      info.value = isOpen ? (opensLeft ? -1.15 : 1.15) : 0;
    } else if (info.type === 'drawer'){
      info.value = isOpen ? 0.25 : 0;
    }
  });
  wardrobeRefs.covers.forEach(c => {
    if (c.userData.isDoorShadow){
      // Shadow-планы нужны только для закрытых дверей — иначе перекрывают вид внутрь
      c.visible = !isOpen && !isXray;
    } else {
      c.visible = !isXray;
    }
  });
}

// Рендер по требованию: кадр рисуется только когда что-то меняется.
// В покое — 0 нагрузки на GPU (вместо постоянных 60fps full-screen проходов).
let needsRender = true;
let _lastRenderAt = 0;
let _dimsLastUpdate = 0;
let _interacting = false;            // идёт вращение/панорама — лёгкий режим
let _dimsHiddenByInteraction = false;
let _settleOutline = false;          // ждём затихания инерции, чтобы вернуть OutlinePass
let _lastControlsChange = 0;
function requestRender(){ needsRender = true; }

function animate(){
  requestAnimationFrame(animate);
  let animating = false;

  if (animState.buildScale < 1){
    animState.buildScale = Math.min(1, animState.buildScale + 0.08);
    const s = easeOutCubic(animState.buildScale);
    if (wardrobe) wardrobe.scale.set(1, s, 1);
    animating = true;
  }
  animState.coverTargets.forEach((info, cover) => {
    if (info.type === 'door'){
      const diff = info.value - cover.rotation.y;
      if (Math.abs(diff) > 0.001){ cover.rotation.y += diff * 0.12; animating = true; }
      else if (cover.rotation.y !== info.value){ cover.rotation.y = info.value; animating = true; }
    } else if (info.type === 'drawer'){
      const base = cover.userData.basePos;
      if (!base) return;
      const targetZ = base.z + info.value;
      const diff = targetZ - cover.position.z;
      if (Math.abs(diff) > 0.0005){ cover.position.z += diff * 0.15; animating = true; }
      else if (cover.position.z !== targetZ){ cover.position.z = targetZ; animating = true; }
    }
  });
  if (animating){
    wardrobeRefs.covers.forEach(c => {
      if (c.userData.isDrawerHandle && c.userData.parent){
        c.position.z = c.userData.parent.position.z + 0.013;
      }
    });
  }

  if (targetCameraDist !== null){
    const currentDist = camera.position.distanceTo(controls.target);
    const diff = targetCameraDist - currentDist;
    if (Math.abs(diff) < 0.003){
      targetCameraDist = null;
    } else {
      const newDist = currentDist + diff * 0.12;
      const dir = _zoomDir.subVectors(camera.position, controls.target).normalize();
      camera.position.copy(controls.target).addScaledVector(dir, newDist);
      dimsDirty = true;
      animating = true;
    }
  }

  // Плавная анимация reset камеры
  if (cameraAnim){
    cameraAnim.t = Math.min(1, cameraAnim.t + cameraAnim.step);
    const t = cameraAnim.t;
    const k = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;
    camera.position.lerpVectors(cameraAnim.camFrom, cameraAnim.camTo, k);
    controls.target.lerpVectors(cameraAnim.tgtFrom, cameraAnim.tgtTo, k);
    dimsDirty = true;
    animating = true;
    if (cameraAnim.t >= 1){
      cameraAnim = null;
    }
  }

  controls.update();

  const now = performance.now();

  // Инерция затихла после отпускания → выходим из лёгкого режима, возвращаем OutlinePass
  if (_settleOutline && now - _lastControlsChange > 120){
    _settleOutline = false;
    _interacting = false;
    needsRender = true;   // один кадр с контурами
    dimsDirty = true;
  }

  // Heartbeat-страховка: даже в покое рисуем кадр раз в 500мс (на случай пропущенного invalidate)
  const heartbeat = now - _lastRenderAt > 500;

  if (needsRender || animating || dimsDirty || heartbeat){
    // Во время вращения/панорамы рисуем БЕЗ OutlinePass — это снимает 3 тяжёлых прохода
    // и делает вращение плавным. Контуры возвращаются сразу после отпускания.
    if (composer && !_interacting) composer.render();
    else renderer.render(scene, camera);
    _lastRenderAt = now;
    needsRender = false;

    // FPS-монитор первых ~5 секунд активного рендера
    if (composer && !_fpsCheckDone){
      _fpsFrames++;
      if (_fpsStart === 0) _fpsStart = now;
      else if (now - _fpsStart > 5000){
        const fps = _fpsFrames / ((now - _fpsStart) / 1000);
        _fpsCheckDone = true;
        if (fps < 30){
          console.warn('[wardrobe] FPS ' + fps.toFixed(0) + ' < 30 — отключаю OutlinePass для производительности');
          composer = null;
          needsRender = true;
        }
      }
    }
  }

  // Размерные линии: SVG-DOM дорогой. Во время вращения НЕ трогаем (они спрятаны),
  // пересчитываем один раз после отпускания.
  if (dimsDirty && !_interacting && now - _dimsLastUpdate > 45){
    updateDimensionLines();
    dimsDirty = false;
    _dimsLastUpdate = now;
  }
}

const _zoomDir = new THREE.Vector3();

function onWheel(e){
  e.preventDefault();
  needsRender = true;
  const now = performance.now();
  // ограничиваем — не больше одного "шага накопления" за 16мс (Mac trackpad шлёт 30+ событий за свайп)
  if (now - lastWheelAt < 16) {
    // мягко добавляем половину шага, чтобы накопление продолжалось но медленно
    if (targetCameraDist === null) targetCameraDist = camera.position.distanceTo(controls.target);
    const sign = Math.sign(e.deltaY);
    targetCameraDist *= sign > 0 ? 1.008 : 0.992;
    targetCameraDist = Math.max(controls.minDistance, Math.min(controls.maxDistance, targetCameraDist));
    return;
  }
  lastWheelAt = now;
  if (targetCameraDist === null) targetCameraDist = camera.position.distanceTo(controls.target);
  const sign = Math.sign(e.deltaY);
  // 2.5% за шаг — очень мягко
  targetCameraDist *= sign > 0 ? 1.025 : 0.975;
  targetCameraDist = Math.max(controls.minDistance, Math.min(controls.maxDistance, targetCameraDist));
}

function zoomBy(factor){
  if (targetCameraDist === null) targetCameraDist = camera.position.distanceTo(controls.target);
  targetCameraDist *= factor;
  targetCameraDist = Math.max(controls.minDistance, Math.min(controls.maxDistance, targetCameraDist));
}

function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3) }

const _worldScreenVec = new THREE.Vector3();
function worldToScreen(wpos){
  const canvas = document.getElementById('three-canvas');
  _worldScreenVec.copy(wpos).project(camera);
  return {
    x: (_worldScreenVec.x * 0.5 + 0.5) * canvas.clientWidth,
    y: (-_worldScreenVec.y * 0.5 + 0.5) * canvas.clientHeight,
    behind: _worldScreenVec.z > 1
  };
}

function dimLabel(x, y, text){
  const w = String(text).length * 7.2 + 14;
  return `<g transform="translate(${(x-w/2).toFixed(1)}, ${(y-9).toFixed(1)})" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.2))">
    <rect width="${w.toFixed(1)}" height="18" rx="4" fill="rgba(255,255,255,0.96)" stroke="rgba(0,0,0,0.2)" stroke-width="0.5"/>
    <text x="${(w/2).toFixed(1)}" y="13" text-anchor="middle" font-family="Manrope,sans-serif" font-size="13" font-weight="600" fill="rgba(15,12,10,0.95)">${text}</text>
  </g>`;
}

// Вертикальная размерная линия — как на инженерном чертеже:
// тонкая вертикальная линия от верха до низа секции с засечками сверху и снизу,
// текст повёрнут на 90° (читается снизу вверх), белая подложка
function dimVertical(xWorld, yTopWorld, yBottomWorld, zWorld, valueMm){
  const pTop = worldToScreen(new THREE.Vector3(xWorld, yTopWorld, zWorld));
  const pBot = worldToScreen(new THREE.Vector3(xWorld, yBottomWorld, zWorld));
  if (pTop.behind || pBot.behind) return '';

  // Рисуем линию МЕЖДУ реальными проекциями концов (в перспективе вертикаль мира
  // на экране слегка наклонена). Соседние зоны делят общую мировую точку границы →
  // их отрезки состыковываются идеально, без «лесенки».
  const dx = pTop.x - pBot.x, dy = pTop.y - pBot.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 22) return ''; // слишком мелкая секция — визуальный шум

  const ux = dx / dist, uy = dy / dist;   // вдоль линии (низ → верх)
  const px = -uy, py = ux;                // перпендикуляр (для засечек)

  const txt = String(valueMm);
  const labelW = txt.length * 7 + 10;
  const labelH = 16;
  const minForLabel = labelW + 10;

  // Угол линии в градусах; текст кладём вдоль линии, читаемый снизу вверх
  let angle = Math.atan2(dy, dx) * 180 / Math.PI;
  if (angle > 90) angle -= 180;
  if (angle < -90) angle += 180;

  const midX = (pTop.x + pBot.x) / 2;
  const midY = (pTop.y + pBot.y) / 2;

  let html = '';
  // Основная линия (с отступом 2px от засечек)
  html += `<line x1="${(pBot.x + ux*2).toFixed(1)}" y1="${(pBot.y + uy*2).toFixed(1)}" x2="${(pTop.x - ux*2).toFixed(1)}" y2="${(pTop.y - uy*2).toFixed(1)}" stroke="rgba(20,15,10,0.6)" stroke-width="0.9"/>`;
  // Засечки перпендикулярно линии на обоих концах
  html += `<line x1="${(pTop.x - px*5).toFixed(1)}" y1="${(pTop.y - py*5).toFixed(1)}" x2="${(pTop.x + px*5).toFixed(1)}" y2="${(pTop.y + py*5).toFixed(1)}" stroke="rgba(20,15,10,0.7)" stroke-width="0.9"/>`;
  html += `<line x1="${(pBot.x - px*5).toFixed(1)}" y1="${(pBot.y - py*5).toFixed(1)}" x2="${(pBot.x + px*5).toFixed(1)}" y2="${(pBot.y + py*5).toFixed(1)}" stroke="rgba(20,15,10,0.7)" stroke-width="0.9"/>`;

  if (dist >= minForLabel){
    // Подпись по центру линии, повёрнута вдоль неё
    html += `<g transform="translate(${midX.toFixed(1)},${midY.toFixed(1)}) rotate(${angle.toFixed(1)})" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15))">
      <rect x="${(-labelW/2).toFixed(1)}" y="${(-labelH/2).toFixed(1)}" width="${labelW}" height="${labelH}" rx="3" fill="rgba(255,255,255,0.96)" stroke="rgba(20,15,10,0.2)" stroke-width="0.5"/>
      <text x="0" y="4" text-anchor="middle" font-family="Manrope,sans-serif" font-size="11" font-weight="600" fill="rgba(20,15,10,0.92)">${txt}</text>
    </g>`;
  } else {
    // Маленькая секция — подпись рядом, горизонтально
    html += `<g transform="translate(${(midX + 14).toFixed(1)},${midY.toFixed(1)})" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15))">
      <rect x="${(-labelW/2).toFixed(1)}" y="${(-labelH/2).toFixed(1)}" width="${labelW}" height="${labelH}" rx="3" fill="rgba(255,255,255,0.96)" stroke="rgba(20,15,10,0.2)" stroke-width="0.5"/>
      <text x="0" y="4" text-anchor="middle" font-family="Manrope,sans-serif" font-size="11" font-weight="600" fill="rgba(20,15,10,0.92)">${txt}</text>
    </g>`;
  }
  return html;
}

// Старый inline-label — оставляю для совместимости (используется в местах где нет диапазона)
function dimLabelInner(x, y, text, suffix){
  const txt = suffix ? `${text} · ${suffix}` : String(text);
  const w = txt.length * 6 + 10;
  return `<g transform="translate(${(x-w/2).toFixed(1)}, ${(y-7).toFixed(1)})" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.18))">
    <rect width="${w.toFixed(1)}" height="14" rx="3" fill="rgba(255,255,255,0.92)" stroke="rgba(0,0,0,0.15)" stroke-width="0.5"/>
    <text x="${(w/2).toFixed(1)}" y="10" text-anchor="middle" font-family="Manrope,sans-serif" font-size="10" font-weight="600" fill="rgba(40,30,22,0.9)">${txt}</text>
  </g>`;
}

function dimLine(x1,y1,x2,y2, dashed){
  const stroke = dashed ? 'stroke-dasharray="3,3"' : '';
  return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="rgba(0,0,0,0.45)" stroke-width="0.7" ${stroke}/>`;
}

function dimTick(x,y, angle, len){
  const rx = Math.cos(angle) * len/2;
  const ry = Math.sin(angle) * len/2;
  return `<line x1="${(x-rx).toFixed(1)}" y1="${(y-ry).toFixed(1)}" x2="${(x+rx).toFixed(1)}" y2="${(y+ry).toFixed(1)}" stroke="rgba(0,0,0,0.55)" stroke-width="0.8"/>`;
}


// Размерные линии для одного наполнения в диапазоне высот [bottom..top] (мировые координаты).
// Используется и для обычной ячейки, и для каждой зоны «своей комбинации».
function dimsForFilling(filling, dimX, cellTop, cellBottom, dimZ, inZone){
  let html = '';
  const cellHm = cellTop - cellBottom;
  const cellMid = (cellTop + cellBottom) / 2;
  const cellHmm = Math.round(cellHm * 1000);

  if (filling === 'drawers'){
    // N ящиков по всей высоте ячейки
    const numDrawers = cellHm > 0.7 ? 4 : 3;
    const drH = cellHm / numDrawers;
    const drHmm = Math.round(drH * 1000);
    for (let d = 0; d < numDrawers; d++){
      const top = cellBottom + drH * (d + 1);
      const bottom = cellBottom + drH * d;
      html += dimVertical(dimX, top - 0.003, bottom + 0.003, dimZ, drHmm);
    }
  } else if (filling === 'rod_drawers'){
    // Верх — штанговая зона (½), низ — 2-3 ящика
    const rodTop = cellTop;
    const rodBottom = cellMid;
    const rodHmm = Math.round((rodTop - rodBottom) * 1000);
    html += dimVertical(dimX, rodTop - 0.005, rodBottom + 0.003, dimZ, rodHmm);
    const drZone = cellMid - cellBottom;
    const numDr = drZone > 0.5 ? 3 : 2;
    const drH = drZone / numDr;
    const drHmm = Math.round(drH * 1000);
    for (let d = 0; d < numDr; d++){
      const top = cellBottom + drH * (d + 1);
      const bottom = cellBottom + drH * d;
      html += dimVertical(dimX, top - 0.003, bottom + 0.003, dimZ, drHmm);
    }
  } else if (filling === 'shelves_drawers'){
    // Верх — 2 полки делят на 3 секции, низ — 2 ящика
    const shZone = cellTop - cellMid;
    const shH = shZone / 3;
    const shHmm = Math.round(shH * 1000);
    for (let s = 0; s < 3; s++){
      const top = cellTop - shH * s;
      const bottom = cellTop - shH * (s + 1);
      html += dimVertical(dimX, top - 0.003, bottom + 0.003, dimZ, shHmm);
    }
    const drZone = cellMid - cellBottom;
    const drH = drZone / 2;
    const drHmm = Math.round(drH * 1000);
    for (let d = 0; d < 2; d++){
      const top = cellBottom + drH * (d + 1);
      const bottom = cellBottom + drH * d;
      html += dimVertical(dimX, top - 0.003, bottom + 0.003, dimZ, drHmm);
    }
  } else if (filling === 'shelves'){
    const numSh = cellHm > 0.9 ? 3 : 2;
    const segH = cellHm / (numSh + 1);
    const segHmm = Math.round(segH * 1000);
    for (let s = 0; s < numSh + 1; s++){
      const top = cellBottom + segH * (s + 1);
      const bottom = cellBottom + segH * s;
      html += dimVertical(dimX, top - 0.003, bottom + 0.003, dimZ, segHmm);
    }
  } else if (filling === 'rod_shelf'){
    // Полная ячейка: шапка + штанговая + нижняя полка (3 секции).
    // В зоне шапки нет → 2 секции: штанговая + нижняя
    const topShelfY = inZone ? cellTop : cellTop - 0.025;
    const bottomShelfY = cellBottom + 0.3;
    if (!inZone){
      html += dimVertical(dimX, cellTop - 0.005, topShelfY + 0.003, dimZ, Math.round((cellTop - topShelfY) * 1000));
    }
    html += dimVertical(dimX, topShelfY - (inZone ? 0.005 : 0.003), bottomShelfY + 0.003, dimZ, Math.round((topShelfY - bottomShelfY) * 1000));
    html += dimVertical(dimX, bottomShelfY - 0.003, cellBottom + 0.005, dimZ, Math.round((bottomShelfY - cellBottom) * 1000));
  } else if (filling === 'rod'){
    if (inZone){
      // В зоне — один сегмент на всю высоту зоны
      html += dimVertical(dimX, cellTop - 0.005, cellBottom + 0.005, dimZ, cellHmm);
    } else {
      // Штанга + полка-шапка сверху — две секции
      const topShelfY = cellTop - 0.025;
      html += dimVertical(dimX, cellTop - 0.005, topShelfY + 0.003, dimZ, Math.round((cellTop - topShelfY) * 1000));
      html += dimVertical(dimX, topShelfY - 0.003, cellBottom + 0.005, dimZ, Math.round((topShelfY - cellBottom) * 1000));
    }
  } else if (filling === 'double_rod'){
    const topShelfY = inZone ? cellTop : cellTop - 0.025;
    if (!inZone){
      html += dimVertical(dimX, cellTop - 0.005, topShelfY + 0.003, dimZ, Math.round((cellTop - topShelfY) * 1000));
    }
    // верхняя штанговая зона до середины
    html += dimVertical(dimX, topShelfY - (inZone ? 0.005 : 0.003), cellMid + 0.003, dimZ, Math.round((topShelfY - cellMid) * 1000));
    // нижняя штанговая зона
    html += dimVertical(dimX, cellMid - 0.003, cellBottom + 0.005, dimZ, Math.round((cellMid - cellBottom) * 1000));
  } else if (filling === 'baskets'){
    // 3 корзины по высоте
    const segH = cellHm / 3;
    const segHmm = Math.round(segH * 1000);
    for (let s = 0; s < 3; s++){
      const top = cellBottom + segH * (s + 1);
      const bottom = cellBottom + segH * s;
      html += dimVertical(dimX, top - 0.003, bottom + 0.003, dimZ, segHmm);
    }
  } else if (filling === 'shoes'){
    // 3 наклонные полки — секции между ними
    const segH = cellHm / 4;
    const segHmm = Math.round(segH * 1000);
    for (let s = 0; s < 4; s++){
      const top = cellBottom + segH * (s + 1);
      const bottom = cellBottom + segH * s;
      html += dimVertical(dimX, top - 0.003, bottom + 0.003, dimZ, segHmm);
    }
  } else if (filling === 'drawer_box'){
    // Наружный ящик — один габарит на зону
    html += dimVertical(dimX, cellTop - 0.005, cellBottom + 0.005, dimZ, cellHmm);
  } else {
    // empty или неизвестный — одна метка на всю ячейку
    html += dimVertical(dimX, cellTop - 0.005, cellBottom + 0.005, dimZ, cellHmm);
  }
  return html;
}

function updateDimensionLines(){
  const svg = document.getElementById('dim-content');
  const svgEl = document.getElementById('dim-svg');
  if (!svg || !wardrobe) return;
  // В режиме редактирования колонны размеры показываются ВСЕГДА — менеджер настраивает
  // зоны и обязан видеть высоты, даже если переключатель размеров выключен
  const forceDims = isEditingCell();
  if (!state.showDims && !forceDims){
    svgEl.classList.add('hidden');
    return;
  }
  svgEl.classList.remove('hidden');

  const W = state.width / 1000;
  const H = state.height / 1000;
  const D = state.depth / 1000;
  const T = 0.016;
  const socketH = state.socket / 1000;
  const antH = state.antresol ? state.antresolH / 1000 : 0;
  const innerW = W - 2*T;
  const cellWm = innerW / state.cols;
  const cellHm = (H - socketH - 2*T - antH) / state.rows;
  const gridY0 = socketH + T;
  const wbZ = -2.5 + D/2 + 0.015;

  const TFL = worldToScreen(new THREE.Vector3(-W/2, H, D/2 + wbZ));
  const TFR = worldToScreen(new THREE.Vector3(W/2, H, D/2 + wbZ));
  const TBR = worldToScreen(new THREE.Vector3(W/2, H, -D/2 + wbZ));
  const BFR = worldToScreen(new THREE.Vector3(W/2, 0, D/2 + wbZ));

  if (TFL.behind || TFR.behind){
    svg.innerHTML = '';
    return;
  }

  let html = '';

  const widthLineY = Math.min(TFL.y, TFR.y) - 36;
  html += dimLine(TFL.x, widthLineY, TFR.x, widthLineY);
  html += dimTick(TFL.x, widthLineY, Math.PI/2, 10);
  html += dimTick(TFR.x, widthLineY, Math.PI/2, 10);
  html += dimLine(TFL.x, TFL.y, TFL.x, widthLineY, true);
  html += dimLine(TFR.x, TFR.y, TFR.x, widthLineY, true);
  html += dimLabel((TFL.x + TFR.x)/2, widthLineY, state.width + ' мм');

  const heightLineX = Math.max(TFR.x, BFR.x) + 40;
  html += dimLine(heightLineX, TFR.y, heightLineX, BFR.y);
  html += dimTick(heightLineX, TFR.y, 0, 10);
  html += dimTick(heightLineX, BFR.y, 0, 10);
  html += dimLine(TFR.x, TFR.y, heightLineX, TFR.y, true);
  html += dimLine(BFR.x, BFR.y, heightLineX, BFR.y, true);
  html += dimLabel(heightLineX + 28, (TFR.y + BFR.y)/2, state.height + ' мм');

  // Глубина — только лейбл в середине ребра, без линии (линия по ребру в перспективе диагональная — выглядит «кривой»)
  html += dimLabel((TFR.x + TBR.x)/2, (TFR.y + TBR.y)/2 - 14, state.depth + ' мм');

  if (state.cols >= 2 && state.cols <= 8){
    for (let c = 0; c < state.cols; c++){
      const x = -innerW/2 + cellWm * c + cellWm/2;
      const pTop = worldToScreen(new THREE.Vector3(x, H + 0.005, D/2 + wbZ));
      if (!pTop.behind){
        html += dimLabel(pTop.x, pTop.y - 16, Math.round(cellWm * 1000));
      }
    }
  }

  // Размерные метки рядов справа от шкафа — оставлены только когда колонна не выбрана/не hover
  // (когда выбрана — рисуются вертикальные dim-линии внутри колонны для каждой секции)
  const noColumnFocus = !(typeof state.editingCell === 'number' && state.editingCell >= 0) &&
                        !(typeof hoveredCell === 'number' && hoveredCell >= 0);
  if (noColumnFocus && state.rows >= 2 && state.rows <= 6){
    for (let r = 0; r < state.rows; r++){
      const y = gridY0 + cellHm * (state.rows - r - 1) + cellHm/2;
      const pRight = worldToScreen(new THREE.Vector3(W/2 + 0.005, y, D/2 + wbZ));
      if (!pRight.behind){
        html += dimLabel(pRight.x + 22, pRight.y, Math.round(cellHm * 1000));
      }
    }
  }

  // === Размеры внутри ВЫДЕЛЕННОЙ (или hover'нутой) колонны ===
  // Вертикальные размерные линии с засечками — как на инженерных чертежах
  let targetCol = -1;
  if (typeof state.editingCell === 'number' && state.editingCell >= 0){
    targetCol = state.editingCell % state.cols;
  } else if (typeof hoveredCell === 'number' && hoveredCell >= 0){
    targetCol = hoveredCell % state.cols;
  }
  if (targetCol >= 0){
    const editingCol = targetCol;
    // X-позиция линии — слева внутри колонны, на ~6см от левого края
    const colLeftX = -innerW/2 + cellWm * editingCol;
    const dimX = colLeftX + 0.06;
    const dimZ = D/2 + wbZ + 0.001;

    for (let r = 0; r < state.rows; r++){
      const idx = r * state.cols + editingCol;
      const cell = state.cells[idx];
      if (!cell) continue;
      const cellTop = gridY0 + cellHm * (state.rows - r);
      const cellBottom = gridY0 + cellHm * (state.rows - r - 1);
      const cellMid = (cellTop + cellBottom) / 2;
      const cellHmm = Math.round(cellHm * 1000);

      if (cell.type === 'drawer'){
        // Внешний ящик — единая вертикальная линия от верха до низа ячейки
        html += dimVertical(dimX, cellTop - 0.005, cellBottom + 0.005, dimZ, cellHmm);
        continue;
      }

      // Резолвим auto-наполнение в конкретный тип — как в drawCellFilling
      let filling = cell.filling || 'auto';
      if (filling === 'auto'){
        filling = cellHmm > 1500 ? 'rod_shelf' : cellHmm > 900 ? 'rod' : 'shelves';
      }

      // Своя комбинация: каждая зона детализируется как обычное наполнение
      // (ящики — каждый ящик, обувница — каждая секция и т.д.)
      if (filling === 'custom' && Array.isArray(cell.stack) && cell.stack.length){
        const zones = computeStackZones(cell.stack, cellHmm);
        for (const z of zones){
          const top = cellBottom + z.topMm / 1000;
          const bottom = cellBottom + z.bottomMm / 1000;
          html += dimsForFilling(z.f, dimX, top, bottom, dimZ, true);
        }
        continue;
      }

      html += dimsForFilling(filling, dimX, cellTop, cellBottom, dimZ);
    }
  }

  svg.innerHTML = html;
}

function onPointerMove(e){
  const canvas = document.getElementById('three-canvas');
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const intersects = raycaster.intersectObjects(wardrobeRefs.cellMeshes, false);
  if (intersects.length > 0){
    const hit = intersects[0].object;
    const id = hit.userData.isWing ? ('wing' + (hit.userData.wingRow || 0)) : hit.userData.cellIndex;
    if (id !== hoveredCell){
      hoveredCell = id;
      canvas.classList.add('hovering');
      updateCellInfoPopover();
      updateHoverXray();
      dimsDirty = true; // перерисовать размеры внутри hovered колонны
    }
  } else if (hoveredCell !== -1){
    hoveredCell = -1;
    canvas.classList.remove('hovering');
    updateCellInfoPopover();
    updateHoverXray();
    dimsDirty = true;
  }
}

// При наведении на колонну её фасады скрываются — содержимое видно
// Работает только в режиме «Закрыто» и когда нет активного редактирования
function updateHoverXray(){
  needsRender = true;
  if (!wardrobeRefs.covers) return;
  const applyHover = state.view === 'closed' && !isEditingCell();
  const hoveredCol = applyHover && typeof hoveredCell === 'number' && hoveredCell >= 0
    ? hoveredCell % state.cols : -1;
  const hoverWing = applyHover && isWingId(hoveredCell);

  for (const cover of wardrobeRefs.covers){
    const cellIdx = cover.userData.cellIndex;
    const isWingFront = cover.userData.isWingFront || (cover.parent && cover.parent.userData && cover.parent.userData.isWingDoor);
    let isInHoverColumn = false;
    if (typeof cellIdx === 'number' && cellIdx >= 0 && hoveredCol >= 0){
      isInHoverColumn = (cellIdx % state.cols) === hoveredCol;
    } else if (hoverWing && isWingFront){
      isInHoverColumn = true;
    }

    // Восстановление обычной видимости (для shadow planes — также учитываем view mode)
    if (cover.userData.isDoorShadow){
      // Shadow plane виден когда: не xray, не open, и не в hover-колонне
      const isOpen = state.view === 'open';
      const isXray = state.view === 'xray';
      cover.visible = !isOpen && !isXray && !isInHoverColumn;
    } else {
      // Дверь/ящик/handle — скрываем только в hover-колонне (в open/xray ими управляет applyViewMode)
      if (isInHoverColumn){
        cover.visible = false;
      } else {
        // Восстанавливаем по правилам applyViewMode
        const isXray = state.view === 'xray';
        cover.visible = !isXray;
      }
    }
  }
}

// Человекочитаемое имя наполнения (включая 'custom' — перечисление зон снизу вверх)
function zoneName(f){
  if (f === 'drawer_box') return 'Ящик наружный';
  return FILLINGS[f] ? FILLINGS[f].name : f;
}

function fillingDisplayName(cell, cellHmm){
  if (!cell) return '—';
  if (cell.filling === 'custom' && Array.isArray(cell.stack) && cell.stack.length){
    return cell.stack.map(z => zoneName(z.f).toLowerCase()).join(' + ');
  }
  const fk = (cell.filling === 'auto' || !cell.filling)
    ? (cellHmm > 1500 ? 'rod_shelf' : cellHmm > 900 ? 'rod' : 'shelves')
    : cell.filling;
  return FILLINGS[fk] ? FILLINGS[fk].name : 'Авто';
}

function updateCellInfoPopover(){
  const pop = document.getElementById('cell-info-popover');
  if (!pop) return;
  // Скрываем popover если: нет hover, в режиме cell-edit (там cell-edit body уже показывает), или мобильный
  if (hoveredCell === -1 || isEditingCell()){
    pop.classList.remove('show');
    return;
  }
  const isWing = isWingId(hoveredCell);

  if (isWing){
    const wing = wingCellOf(hoveredCell);
    const gridHmm = state.height - state.socket - (state.antresol ? state.antresolH : 0) - 32;
    const fillingName = wing.type === 'drawer' ? '—' : fillingDisplayName(wing, gridHmm);
    const colorKey = wing.color || state.defaultDoorColor;
    const colorInfo = COLORS[colorKey];
    const colorLabel = wing.color
      ? `<span class="cip-color-dot" style="background:${colorInfo.hex}"></span>${colorInfo.name}`
      : `<span class="cip-color-dot" style="background:${COLORS[state.bodyColor].hex}"></span><span style="color:var(--text-3);font-size:11px">как корпус</span>`;
    pop.innerHTML = `
      <div class="cip-title">Угловое крыло</div>
      <div class="cip-size">${state.depth-32}×${gridHmm} мм · ${state.wingLength} мм вглубь</div>
      <div class="cip-row"><span>Тип</span><span>${CELL_TYPES[wing.type].name}</span></div>
      ${wing.type !== 'drawer' ? `<div class="cip-row"><span>Наполнение</span><span>${fillingName}</span></div>` : ''}
      <div class="cip-row"><span>Цвет</span><span>${colorLabel}</span></div>
      <div class="cip-actions">
        <button class="cip-btn primary" id="cip-edit-btn">Изменить</button>
      </div>
    `;
    pop.classList.add('show');
    const editBtn = document.getElementById('cip-edit-btn');
    if (editBtn) editBtn.addEventListener('click', () => openCellEditor(isWingId(hoveredCell) ? hoveredCell : 'wing0'));
    return;
  }

  // Обычная колонна — показываем содержимое сверху вниз
  const c = hoveredCell % state.cols;
  const cellWmm = Math.round((state.width - 32) / state.cols);
  const gridHmm = state.height - state.socket - (state.antresol ? state.antresolH : 0) - 32;
  const cellHmm = Math.round(gridHmm / state.rows);

  // Список содержимого колонны сверху вниз
  let contentsHtml = '';
  for (let r = 0; r < state.rows; r++){
    const idx = r * state.cols + c;
    const cell = state.cells[idx];
    if (!cell) continue;
    const fName = cell.type === 'drawer' ? '—' : fillingDisplayName(cell, cellHmm);
    const typeName = CELL_TYPES[cell.type].name;
    const positionLabel = state.rows === 1 ? '' : (r === 0 ? 'Верх' : r === state.rows-1 ? 'Низ' : `Ряд ${r+1}`);
    contentsHtml += `<div class="cip-row">
      <span>${positionLabel || `Ряд ${r+1}`}</span>
      <span>${typeName}${cell.type !== 'drawer' ? ' · ' + fName.toLowerCase() : ''}</span>
    </div>`;
  }

  pop.innerHTML = `
    <div class="cip-title">Колонна ${c+1}</div>
    <div class="cip-size">${cellWmm} × ${gridHmm} мм · ${state.rows} ${state.rows === 1 ? 'секция' : state.rows < 5 ? 'секции' : 'секций'}</div>
    ${contentsHtml}
    <div class="cip-actions">
      <button class="cip-btn primary" id="cip-edit-btn">Настроить колонну</button>
    </div>
  `;
  pop.classList.add('show');

  const editBtn = document.getElementById('cip-edit-btn');
  if (editBtn){
    editBtn.addEventListener('click', () => {
      openCellEditor(hoveredCell);
    });
  }
}

function onCellClick(clientX, clientY){
  const canvas = document.getElementById('three-canvas');
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const intersects = raycaster.intersectObjects(wardrobeRefs.cellMeshes, false);
  if (intersects.length === 0){
    // Тап мимо шкафа на таче — сброс выделения
    if (IS_TOUCH && hoveredCell !== -1){
      hoveredCell = -1;
      updateHoverXray();
      dimsDirty = true;
    }
    return;
  }
  const hit = intersects[0].object;
  const id = hit.userData.isWing ? ('wing' + (hit.userData.wingRow || 0)) : hit.userData.cellIndex;

  // На таче: первый тап выделяет колонну (xray + размеры), второй тап — редактор.
  // Hover на таче не существует, поэтому tap берёт его роль.
  if (IS_TOUCH && hoveredCell !== id && !isEditingCell()){
    hoveredCell = id;
    updateHoverXray();
    updateCellInfoPopover();
    dimsDirty = true;
    return;
  }
  openCellEditor(id);
}

let _viewBeforeEdit = null;

function openCellEditor(idx){
  const wasEditing = isEditingCell();
  // При первом входе в редактирование — запомнить вид и переключить в xray для видимости наполнения
  if (!wasEditing && state.view !== 'xray'){
    _viewBeforeEdit = state.view;
    state.view = 'xray';
    applyViewMode();
  }
  state.editingCell = idx;
  state.hasUsedCellEdit = true;
  updateCellHighlight();
  dimsDirty = true; // размеры колонны перерисовать сразу (показываются даже при выключенном тоггле)
  // Скрыть hover-popover (cell-edit body теперь показывает информацию)
  const pop = document.getElementById('cell-info-popover');
  if (pop) pop.classList.remove('show');
  renderUI();
}

function closeCellEditor(){
  // На шаге 2 редактор является основным содержанием — не закрываем его, переключаемся на шаг 1
  if (state.step === 2){
    gotoStep(1);
    return;
  }
  state.editingCell = -1;
  dimsDirty = true; // вернуть скрытие размеров, если переключатель выключен
  // Восстановить вид если был временно изменён
  if (_viewBeforeEdit !== null){
    state.view = _viewBeforeEdit;
    _viewBeforeEdit = null;
    applyViewMode();
  }
  updateCellHighlight();
  renderUI();
}

function nearestKey(obj, val){
  const keys = Object.keys(obj).map(Number).sort((a,b)=>a-b);
  let res = keys[0];
  for (const k of keys){ if (val >= k) res = k; }
  return res;
}

function calcPrice(){
  const wM = state.width / 1000;
  const hM = state.height / 1000;
  const area = wM * hM;

  const depthMult = CONFIG.depthMult[nearestKey(CONFIG.depthMult, state.depth)];
  const heightMult = CONFIG.heightMult[nearestKey(CONFIG.heightMult, state.height)];
  const colorMult = COLORS[state.bodyColor].mult;
  const shapeMult = SHAPES[state.shape].mult;
  // Множители материала: корпус и фасады могут быть ЛДСП или МДФ
  const bodyMatMult = (CONFIG.materials[state.bodyMaterial] || CONFIG.materials.ldsp).bodyMult;
  const facadeMatMult = (CONFIG.materials[state.facadeMaterial] || CONFIG.materials.ldsp).facadeMult;
  const basePerM2 = CONFIG.basePerM2 * bodyMatMult;
  const doorPerM2 = CONFIG.doorPerM2 * facadeMatMult;

  let body = area * basePerM2 * depthMult * heightMult * colorMult * shapeMult;
  body += (state.cols - 1) * (hM - state.socket/1000) * CONFIG.dividerPerM;
  body += (state.rows - 1) * wM * CONFIG.shelfPerM;

  if (SHAPES[state.shape].hasWing){
    const wingM = state.wingLength / 1000;
    const _nWings = (SHAPES[state.shape].wingSides || [SHAPES[state.shape].wingSide]).length;
    body += _nWings * wingM * hM * basePerM2 * depthMult * heightMult * colorMult * CONFIG.cornerWingMult;
  }

  const cellArea = (wM * (hM - state.socket/1000 - (state.antresol ? state.antresolH/1000 : 0))) / (state.cols * state.rows);
  const hingePrice = CONFIG.hinges[state.hinges].price;
  const handleData = HANDLES[state.defaultHandle];
  let coversCost = 0, hingesCost = 0, handlesCost = 0, doorCount = 0, fillingCost = 0;

  const gridHmm = state.height - state.socket - (state.antresol ? state.antresolH : 0) - 32;
  const cellHmm = Math.round(gridHmm / state.rows);

  let drawerCount = 0;
  for (const cell of state.cells){
    const hasFacadeZones = cell.type !== 'drawer' && cell.type !== 'open'
      && cell.filling === 'custom' && Array.isArray(cell.stack)
      && cell.stack.some(z => z.f === 'drawer_box');

    if (cell.type === 'open') {} else if (cell.type === 'drawer'){
      coversCost += CONFIG.drawerPrice;
      drawerCount++;
    } else if (hasFacadeZones){
      // Сегментированный фасад: двери по сегментам + наружные ящики по зонам
      const colorKey = cell.color || state.defaultDoorColor;
      let mult = COLORS[colorKey].mult;
      if (cell.type === 'mirror') mult *= CONFIG.mirrorPremium;
      if (cell.type === 'glass') mult *= CONFIG.glassPremium;
      const zonesP = computeStackZones(cell.stack, cellHmm);
      const cellWm2 = (state.width - 32) / 1000 / state.cols; // ширина колонны, м
      let doorRunMm = 0;
      const flushDoorRun = () => {
        if (doorRunMm <= 0) return;
        coversCost += cellWm2 * (doorRunMm / 1000) * doorPerM2 * mult;
        const hingesPerDoor = doorRunMm <= 1000 ? 2 : doorRunMm <= 1500 ? 3 : doorRunMm <= 2000 ? 4 : 5;
        hingesCost += hingesPerDoor * hingePrice;
        handlesCost += handleData.pricePerDoor || 0;
        doorCount++;
        doorRunMm = 0;
      };
      for (const z of zonesP){
        if (z.f === 'drawer_box'){
          flushDoorRun();
          coversCost += CONFIG.drawerPrice;
          drawerCount++;
        } else {
          doorRunMm += z.topMm - z.bottomMm;
        }
      }
      flushDoorRun();
    } else {
      const colorKey = cell.color || state.defaultDoorColor;
      let mult = COLORS[colorKey].mult;
      if (cell.type === 'mirror') mult *= CONFIG.mirrorPremium;
      if (cell.type === 'glass') mult *= CONFIG.glassPremium;
      coversCost += cellArea * doorPerM2 * mult;
      // Количество петель по высоте двери: до 1000мм — 2, до 1500 — 3, до 2000 — 4, выше — 5
      const doorHmm = cellHmm;
      const hingesPerDoor = doorHmm <= 1000 ? 2 : doorHmm <= 1500 ? 3 : doorHmm <= 2000 ? 4 : 5;
      hingesCost += hingesPerDoor * hingePrice;
      handlesCost += handleData.pricePerDoor || 0;
      doorCount++;
    }
    // Цена наполнения — для всех типов кроме ящика
    if (cell.type !== 'drawer'){
      const fillingKey = cell.filling === 'auto' || !cell.filling
        ? (cellHmm > 1500 ? 'rod_shelf' : cellHmm > 900 ? 'rod' : 'shelves')
        : cell.filling;
      if (fillingKey === 'custom' && Array.isArray(cell.stack)){
        // Своя комбинация: суммируем цены зон + направляющие для зон-ящиков
        const zones = computeStackZones(cell.stack, cellHmm);
        for (const z of zones){
          fillingCost += (FILLINGS[z.f] && FILLINGS[z.f].price) || 0;
          if (z.f === 'drawers'){
            const zH = z.topMm - z.bottomMm;
            drawerCount += zH > 700 ? 4 : zH > 450 ? 3 : 2;
          }
          if (z.f === 'rod_drawers') drawerCount += 2;
          if (z.f === 'shelves_drawers') drawerCount += 2;
          if (z.f === 'baskets') drawerCount += 3; // корзины тоже на направляющих
        }
      } else {
        fillingCost += (FILLINGS[fillingKey] && FILLINGS[fillingKey].price) || 0;
        // Если filling='drawers' — внутри 3-4 выдвижных ящика, каждый требует направляющих
        if (fillingKey === 'drawers'){
          const innerDrawers = cellHmm > 700 ? 4 : 3;
          drawerCount += innerDrawers;
        }
      }
    }
  }

  // === Цена секций крыла (фасады, петли, наполнение) ===
  const _wingCount = (SHAPES[state.shape].wingSides || [SHAPES[state.shape].wingSide]).length;
  for (let _wi = 0; _wi < _wingCount; _wi++)
  if (SHAPES[state.shape].hasWing && Array.isArray(state.wingCells)){
    const wingDepthM = (state.depth - 32) / 1000;       // ширина фасада крыла = глубина шкафа
    const wingSecHmm = Math.round(gridHmm / (state.wingRows || 1));
    const wingSecHm = wingSecHmm / 1000;
    const wingSecAreaM2 = wingDepthM * wingSecHm;
    for (const wc of state.wingCells){
      if (wc.type === 'open') {
        // открытая секция — без фасада
      } else if (wc.type === 'drawer'){
        coversCost += CONFIG.drawerPrice;
        drawerCount++;
      } else {
        const colorKey = wc.color || state.defaultDoorColor;
        let mult = COLORS[colorKey].mult;
        if (wc.type === 'mirror') mult *= CONFIG.mirrorPremium;
        if (wc.type === 'glass') mult *= CONFIG.glassPremium;
        coversCost += wingSecAreaM2 * doorPerM2 * mult;
        const hpd = wingSecHmm <= 1000 ? 2 : wingSecHmm <= 1500 ? 3 : wingSecHmm <= 2000 ? 4 : 5;
        hingesCost += hpd * hingePrice;
        handlesCost += handleData.pricePerDoor || 0;
        doorCount++;
      }
      // Наполнение секции крыла
      if (wc.type !== 'drawer'){
        const fk = (wc.filling === 'auto' || !wc.filling)
          ? (wingSecHmm > 1500 ? 'rod_shelf' : wingSecHmm > 900 ? 'rod' : 'shelves')
          : wc.filling;
        if (fk === 'custom' && Array.isArray(wc.stack)){
          for (const z of computeStackZones(wc.stack, wingSecHmm)){
            fillingCost += (FILLINGS[z.f] && FILLINGS[z.f].price) || 0;
            if (z.f === 'drawers'){ const zH = z.topMm - z.bottomMm; drawerCount += zH > 700 ? 4 : zH > 450 ? 3 : 2; }
            if (z.f === 'rod_drawers' || z.f === 'shelves_drawers') drawerCount += 2;
            if (z.f === 'baskets') drawerCount += 3;
          }
        } else {
          fillingCost += (FILLINGS[fk] && FILLINGS[fk].price) || 0;
          if (fk === 'drawers') drawerCount += wingSecHmm > 700 ? 4 : 3;
        }
      }
    }
  }

  // Направляющие ящиков — пара на каждый ящик
  const slidePrice = (CONFIG.slides[state.slides] && CONFIG.slides[state.slides].price) || 0;
  const slidesCost = drawerCount * 2 * slidePrice;

  // Задняя стенка — площадь × цена за м²
  const backW = state.backWall || 'hdf_white';
  const backArea = wM * (hM - state.socket/1000);
  const backCfg = CONFIG.backWalls[backW];
  const backCost = backCfg ? backArea * backCfg.pricePerM2 : 0;

  let extras = 0;
  if (state.antresol) extras += area * CONFIG.antresolPerM2;
  if (state.socket > 0) extras += CONFIG.socketBase + wM * CONFIG.socketPerM;
  if (state.lighting) extras += CONFIG.lightingBase + doorCount * CONFIG.lightingPerDoor;
  if (state.edge === 'thin') extras += area * CONFIG.edgeThinPerM2;
  if (state.edge === 'thick') extras += area * CONFIG.edgeThickPerM2;
  if (state.pushOpen) extras += doorCount * CONFIG.pushOpenPer;
  extras += fillingCost;
  extras += slidesCost;
  extras += backCost;

  return {
    total: Math.round(body + coversCost + hingesCost + handlesCost + extras),
    body: Math.round(body),
    covers: Math.round(coversCost + hingesCost + handlesCost),
    extras: Math.round(extras),
    filling: Math.round(fillingCost),
    slides: Math.round(slidesCost),
    back: Math.round(backCost),
    doorCount,
    drawerCount
  };
}

function fmt(n){ return n.toLocaleString('ru-RU').replace(/,/g,'\u00A0') + ' ₽' }

// Выгрузка спецификации деталей в Excel (SheetJS, клиентская генерация)
let _xlsxLib = null;
async function loadXLSX(){
  if (_xlsxLib) return _xlsxLib;
  const mod = await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm');
  _xlsxLib = mod.default || mod;
  return _xlsxLib;
}
async function exportSpecToExcel(){
  const btn = document.getElementById('export-spec');
  try {
    if (btn){ btn.disabled = true; btn.style.opacity = '0.6'; }
    const XLSX = await loadXLSX();
    const cut = computeCutList();
    const sh = SHAPES[state.shape];

    // Лист 1 — Детали
    const head = ['№', 'Деталь', 'Материал', 'Толщина, мм', 'Ширина, мм', 'Высота, мм', 'Кол-во', 'Площадь, м²'];
    const rows = cut.parts.map((p, i) => [i+1, p.name, p.material, p.thick, p.w, p.h, p.qty, p.areaM2]);
    // Итоги по материалам
    rows.push([]);
    rows.push(['', 'ИТОГО ПО МАТЕРИАЛАМ', '', '', '', '', '', '']);
    for (const [k,v] of Object.entries(cut.totals)) rows.push(['', k, '', '', '', '', '', +v.toFixed(2)]);
    const totalArea = Object.values(cut.totals).reduce((a,b)=>a+b,0);
    rows.push(['', 'Всего площади', '', '', '', '', '', +totalArea.toFixed(2)]);

    const aoa = [
      ['СПЕЦИФИКАЦИЯ ДЕТАЛЕЙ — ARSI-HOME'],
      [`Шкаф: ${sh.name}${sh.hasWing ? ' ('+sh.sub+')' : ''}, ${state.width}×${state.height}×${state.depth} мм`],
      [`Корпус: ${CONFIG.materials[state.bodyMaterial].name} · Фасады: ${CONFIG.materials[state.facadeMaterial].name}`],
      [`Дата: ${new Date().toLocaleDateString('ru-RU')}`],
      [],
      head,
      ...rows
    ];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{wch:5},{wch:36},{wch:20},{wch:12},{wch:12},{wch:11},{wch:8},{wch:12}];
    ws['!merges'] = [
      {s:{r:0,c:0},e:{r:0,c:7}},
      {s:{r:1,c:0},e:{r:1,c:7}},
      {s:{r:2,c:0},e:{r:2,c:7}},
      {s:{r:3,c:0},e:{r:3,c:7}}
    ];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Детали');

    const fname = `Спецификация_ARSI_${state.width}x${state.height}x${state.depth}.xlsx`;
    XLSX.writeFile(wb, fname);
  } catch(e){
    alert('Не удалось сформировать Excel: ' + (e && e.message ? e.message : e) + '\nПроверьте подключение к интернету.');
  } finally {
    if (btn){ btn.disabled = false; btn.style.opacity = '1'; }
  }
}

// === ДЕТАЛИРОВКА (расчёт материала) ===
// Перечисляет все детали шкафа по материалам и толщинам с размерами и количеством.
// Возвращает { parts:[{name, material, thick, w, h, qty, areaM2}], totals:{ '<материал> <толщина>': м² } }
function computeCutList(){
  const T = 16;                       // толщина плиты корпуса, мм
  const FT = 18;                      // толщина фасада, мм
  const BT = 3;                       // толщина задней стенки (ХДФ), мм
  const W = state.width, H = state.height, D = state.depth;
  const socket = state.socket || 0;
  const antH = state.antresol ? state.antresolH : 0;
  const bodyH = H - socket;
  const innerW = W - 2*T;
  const gridH = bodyH - 2*T - antH;
  const cols = state.cols, rows = state.rows;
  const cellW = innerW / cols;
  const cellH = gridH / rows;

  const bodyMatName = (CONFIG.materials[state.bodyMaterial] || CONFIG.materials.ldsp).name;
  const facadeMatName = (CONFIG.materials[state.facadeMaterial] || CONFIG.materials.ldsp).name;

  const parts = [];
  const add = (name, material, thick, w, h, qty) => {
    if (qty <= 0 || w <= 0 || h <= 0) return;
    parts.push({ name, material, thick, w: Math.round(w), h: Math.round(h), qty,
      areaM2: +((w/1000) * (h/1000) * qty).toFixed(3) });
  };

  // --- Корпус (ЛДСП/МДФ корпуса, 16мм) ---
  add('Боковая стенка', bodyMatName, T, D, bodyH, 2);
  add('Крыша', bodyMatName, T, innerW, D, 1);
  add('Дно', bodyMatName, T, innerW, D, 1);
  if (cols > 1) add('Стойка вертикальная', bodyMatName, T, D - T, gridH, cols - 1);
  if (rows > 1) add('Полка горизонтальная (между секциями)', bodyMatName, T, cellW - T, D - T, (rows - 1) * cols);
  if (antH > 0){
    add('Полка антресоли', bodyMatName, T, innerW, D, 1);
    if (cols > 1) add('Стойка антресоли', bodyMatName, T, D - T, antH, cols - 1);
  }
  if (socket > 0){
    add('Цоколь передний/задний', bodyMatName, T, W, socket, 2);
    add('Цоколь боковой', bodyMatName, T, D - 2*T, socket, 2);
  }

  // --- Наполнение (полки внутри секций) ---
  let innerShelves = 0;
  const countShelvesFor = (filling, hMm) => {
    if (filling === 'shelves') return hMm > 900 ? 3 : 2;
    if (filling === 'rod') return 0;
    return 0;
  };
  for (const cell of state.cells){
    if (cell.type === 'open' || cell.type === 'drawer') {}
    if (cell.filling === 'custom' && Array.isArray(cell.stack)){
      const zones = computeStackZones(cell.stack, Math.round(cellH));
      innerShelves += Math.max(0, zones.length - 1); // полки-разделители между зонами
      for (const z of zones){
        const zh = z.topMm - z.bottomMm;
        innerShelves += countShelvesFor(z.f, zh);
      }
    } else {
      innerShelves += countShelvesFor(cell.filling, Math.round(cellH));
    }
  }
  if (innerShelves > 0) add('Полка съёмная (наполнение)', bodyMatName, T, cellW - 4, D - 40, innerShelves);

  // --- Фасады (двери/ящики, 18мм) ---
  let doorCount = 0, drawerFronts = 0;
  const facW = cellW - 4;  // фасад чуть уже проёма (зазоры)
  for (const cell of state.cells){
    if (cell.type === 'open') continue;
    if (cell.type === 'drawer'){ drawerFronts++; continue; }
    if (cell.filling === 'custom' && Array.isArray(cell.stack) && cell.stack.some(z => z.f === 'drawer_box')){
      // сегментированный фасад: дверные участки + ящики
      const zones = computeStackZones(cell.stack, Math.round(cellH));
      let run = 0;
      const flush = () => { if (run > 0){ add('Фасад-дверь', facadeMatName, FT, facW, run - 4, 1); doorCount++; run = 0; } };
      for (const z of zones){
        if (z.f === 'drawer_box'){ flush(); add('Фасад-ящик', facadeMatName, FT, facW, (z.topMm - z.bottomMm) - 4, 1); drawerFronts++; }
        else run += z.topMm - z.bottomMm;
      }
      flush();
    } else {
      add('Фасад-дверь', facadeMatName, FT, facW, cellH - 4, 1);
      doorCount++;
    }
  }
  // Антресольные двери — по колонне
  if (antH > 0){
    add('Фасад антресоли', facadeMatName, FT, facW, antH - 4, cols);
  }

  // --- Крылья (для углового/П-образного) ---
  if (SHAPES[state.shape].hasWing){
    const nWings = (SHAPES[state.shape].wingSides || [SHAPES[state.shape].wingSide]).length;
    const wingLen = state.wingLength;
    const wRows = state.wingRows || 1;
    const wSecH = gridH / wRows;
    const wingInnerW = D - 2*T;
    // Корпус крыла
    add('Крыло: стенка передняя', bodyMatName, T, D, bodyH, nWings);
    add('Крыло: стенка торцевая', bodyMatName, T, wingLen, bodyH, nWings);
    add('Крыло: крыша', bodyMatName, T, D, wingLen, nWings);
    add('Крыло: дно', bodyMatName, T, D, wingLen, nWings);
    if (wRows > 1) add('Крыло: полка', bodyMatName, T, wingInnerW, wingLen - T, (wRows - 1) * nWings);
    // Фасады крыла
    add('Крыло: фасад-дверь', facadeMatName, FT, wingInnerW - 4, wSecH - 4, wRows * nWings);
  }

  // --- Задняя стенка (ХДФ) ---
  if (state.backWall && state.backWall !== 'none'){
    const backName = (CONFIG.backWalls[state.backWall] || {}).name || 'Задняя стенка';
    const isBody = state.backWall === 'body';
    add('Задняя стенка', isBody ? bodyMatName : backName, isBody ? T : BT, innerW, bodyH - T, 1);
    if (SHAPES[state.shape].hasWing){
      const nWings = (SHAPES[state.shape].wingSides || [SHAPES[state.shape].wingSide]).length;
      add('Задняя стенка крыла', isBody ? bodyMatName : backName, isBody ? T : BT, D - 2*T, bodyH - T, nWings);
    }
  }

  // --- Итоги по материалам и толщине ---
  const totals = {};
  for (const p of parts){
    // Имя материала без дублирования толщины (у ЛДСП имя уже содержит «16 мм»)
    const matBase = p.material.replace(/\s*\d+\s*мм/i, '').trim();
    const key = `${matBase} ${p.thick} мм`;
    totals[key] = +((totals[key] || 0) + p.areaM2).toFixed(3);
  }
  return { parts, totals };
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])) }

function formatPhone(raw){
  let digits = String(raw).replace(/\D/g, '');
  if (digits.length === 0) return '';
  if (digits.startsWith('8')) digits = '7' + digits.slice(1);
  if (!digits.startsWith('7')) digits = '7' + digits;
  digits = digits.slice(0, 11);
  let out = '+7';
  if (digits.length > 1) out += ' (' + digits.slice(1, 4);
  if (digits.length >= 4) out += ')';
  if (digits.length >= 5) out += ' ' + digits.slice(4, 7);
  if (digits.length >= 8) out += '-' + digits.slice(7, 9);
  if (digits.length >= 10) out += '-' + digits.slice(9, 11);
  return out;
}
function isPhoneValid(raw){
  const digits = String(raw).replace(/\D/g, '');
  return digits.length === 11;
}

function buildSummaryText(){
  const p = calcPrice();
  const sh = SHAPES[state.shape];
  const types = {};
  for (const cell of state.cells) types[cell.type] = (types[cell.type] || 0) + 1;
  const gridHmm = state.height - state.socket - (state.antresol ? state.antresolH : 0) - 32;
  const cellHmm = Math.round(gridHmm / state.rows);
  const fillingCounts = {};
  for (const cell of state.cells){
    if (cell.type === 'drawer') continue;
    if (cell.filling === 'custom' && Array.isArray(cell.stack)){
      // Своя комбинация: считаем каждую зону отдельно
      for (const z of cell.stack) fillingCounts[z.f] = (fillingCounts[z.f] || 0) + 1;
      continue;
    }
    const k = cell.filling === 'auto' || !cell.filling
      ? (cellHmm > 1500 ? 'rod_shelf' : cellHmm > 900 ? 'rod' : 'shelves')
      : cell.filling;
    fillingCounts[k] = (fillingCounts[k] || 0) + 1;
  }
  const edgeLabel = state.edge === 'none' ? 'без кромки' : state.edge === 'thin' ? 'ПВХ 0.4 мм' : 'ABS 2 мм';
  const wing = state.wingCells[0];
  const _wingSecH = (state.height - state.socket - (state.antresol ? state.antresolH : 0) - 32) / (state.wingRows || 1);
  const wingFillName = state.wingCells.map(wc =>
    wc.type === 'drawer' ? 'ящик' : fillingDisplayName(wc, _wingSecH)
  ).join(', ');
  const lines = [
    'РАСПАШНОЙ ШКАФ — ARSI-HOME',
    '',
    `Форма:    ${sh.name}${sh.hasWing ? ' (' + sh.sub + ')' : ''}`,
    `Размеры:  ${state.width}×${state.height}×${state.depth}${sh.hasWing ? ', крыло ' + state.wingLength : ''} мм`,
    `Сетка:    ${state.cols}×${state.rows} (${state.cells.length} ячеек)`,
    `Ячейки:   ${Object.entries(types).map(([t,n]) => CELL_TYPES[t].name.toLowerCase()+': '+n).join(', ')}`,
    `Наполнение: ${Object.entries(fillingCounts).map(([k,n]) => zoneName(k).toLowerCase()+': '+n).join(', ') || '—'}`,
    ...(sh.hasWing ? [`Крыло:    ${CELL_TYPES[wing.type].name} · наполнение: ${wingFillName.toLowerCase()}${wing.color ? ' · цвет: ' + COLORS[wing.color].name : ''}`] : []),
    `Корпус:   ${CONFIG.materials[state.bodyMaterial].name}, ${COLORS[state.bodyColor].name}`,
    `Фасады:   ${CONFIG.materials[state.facadeMaterial].name}, ${COLORS[state.defaultDoorColor].name}`,
    `Зад. ст.:  ${(CONFIG.backWalls[state.backWall] || CONFIG.backWalls.hdf_white).name}`,
    `Ручки:    ${HANDLES[state.defaultHandle].name}`,
    `Петли:    ${CONFIG.hinges[state.hinges].name}`,
    ...((state.cells.some(c => c.type === 'drawer' || c.filling === 'drawers')) ? [`Направл.: ${CONFIG.slides[state.slides] ? CONFIG.slides[state.slides].name : '—'}`] : []),
    `Цоколь:   ${state.socket} мм`,
    `Антресоль: ${state.antresol ? state.antresolH + ' мм' : 'нет'}`,
    `Подсветка: ${state.lighting ? 'да' : 'нет'}`,
    `Push:     ${state.pushOpen ? 'да' : 'нет'}`,
    `Кромка:   ${edgeLabel}`,
    ...(state.customer.comment ? ['', 'ПОЖЕЛАНИЯ:', state.customer.comment] : []),
    '',
    `ИТОГО:    ${fmt(p.total)}`,
    `(корпус ${fmt(p.body)} + фасады ${fmt(p.covers)}${p.extras>0?' + опции '+fmt(p.extras):''})`,
  ];
  return lines.join('\n');
}

let lastPrice = 0;
function renderUI(){
  const headClose = document.getElementById('head-close');
  const stepsBar = document.getElementById('steps-bar');

  const inCellEdit = isWingId(state.editingCell) || (typeof state.editingCell === 'number' && state.editingCell >= 0);
  const isWing = isWingId(state.editingCell);
  const isStep2NormalMode = state.step === 2 && inCellEdit;
  const isModalCellEdit = inCellEdit && !isStep2NormalMode;

  if (isModalCellEdit){
    // Модальный режим — cell-edit вызван кликом 3D с другого шага
    if (isWing){
      const wr = wingRowOf(state.editingCell);
      const secNo = state.wingRows - wr;
      const wingDepth = state.depth - 32;
      const wSecHmm = Math.round((state.height - state.socket - (state.antresol ? state.antresolH : 0) - 32) / (state.wingRows || 1));
      document.getElementById('step-num').textContent = state.wingRows > 1 ? `Крыло · секция ${secNo}` : `Угловое крыло`;
      document.getElementById('step-title').innerHTML = state.wingRows > 1 ? `Крыло · секция <em>${secNo}</em>` : `Угловое <em>крыло</em>`;
      document.getElementById('step-desc').innerHTML = `<span class="cell-size-line">${wingDepth}×${wSecHmm} мм фронт · ${state.wingLength} мм вглубь</span>`;
    } else {
      const idx = state.editingCell;
      const c = idx % state.cols;
      document.getElementById('step-num').textContent = `Колонна ${c+1}`;
      const cellWmm = Math.round((state.width - 32) / state.cols);
      const gridHmm = state.height - state.socket - (state.antresol ? state.antresolH : 0) - 32;
      document.getElementById('step-title').innerHTML = `Колонна <em>${c+1}</em>`;
      document.getElementById('step-desc').innerHTML = `<span class="cell-size-line">${cellWmm} × ${gridHmm} мм · ${state.rows} ${state.rows === 1 ? 'секция' : state.rows < 5 ? 'секции' : 'секций'}</span>`;
    }
    headClose.classList.remove('hidden');
    stepsBar.style.opacity = '0.4';
    stepsBar.style.pointerEvents = 'none';
    renderCellEditBody();
  } else {
    const step = state.step;
    const meta = STEPS[step];
    document.getElementById('step-num').textContent = `Шаг ${step} из 4`;
    if (isStep2NormalMode){
      document.getElementById('step-title').innerHTML = meta.em ? `${meta.title} <em>${meta.em}</em>` : meta.title;
      if (isWing){
        document.getElementById('step-desc').innerHTML = `<strong>Угловое крыло</strong> — ${state.wingLength} мм вглубь. <span style="color:var(--text-3)">Кликните колонну чтобы переключиться.</span>`;
      } else {
        const idx = state.editingCell;
        const c = idx % state.cols;
        const cellWmm = Math.round((state.width - 32) / state.cols);
        const gridHmm = state.height - state.socket - (state.antresol ? state.antresolH : 0) - 32;
        document.getElementById('step-desc').innerHTML = `<strong>Колонна ${c+1}</strong> — ${cellWmm}×${gridHmm} мм. <span style="color:var(--text-3)">Кликните другую колонну в 3D или мини-карте.</span>`;
      }
    } else {
      document.getElementById('step-title').innerHTML = meta.em ? `${meta.title} <em>${meta.em}</em>` : meta.title;
      document.getElementById('step-desc').textContent = meta.desc;
    }
    headClose.classList.add('hidden');
    stepsBar.style.opacity = '';
    stepsBar.style.pointerEvents = '';

    document.querySelectorAll('.step-pill').forEach(p => {
      const n = parseInt(p.dataset.step);
      p.classList.remove('done','current');
      if (n < step) p.classList.add('done');
      if (n === step) p.classList.add('current');
    });

    document.getElementById('btn-prev').disabled = step === 1;
    document.getElementById('btn-next').innerHTML = step === 4
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg> Отправить заявку`
      : `Дальше <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 18l6-6-6-6"/></svg>`;

    if (isStep2NormalMode){
      renderCellEditBody();
    } else {
      renderStepBody();
    }
  }

  const price = calcPrice();
  const priceEl = document.getElementById('price-val');
  priceEl.textContent = fmt(price.total);
  if (Math.abs(price.total - lastPrice) > 100){
    priceEl.classList.remove('bump');
    void priceEl.offsetWidth;
    priceEl.classList.add('bump');
  }
  lastPrice = price.total;

  document.querySelectorAll('.vbtn').forEach(b => b.classList.toggle('on', b.dataset.view === state.view));
  document.getElementById('btn-dims').classList.toggle('on', state.showDims);

  if (state.step === 1 && !isEditingCell() && !state.hasUsedCellEdit){
    const hint = document.getElementById('click-hint');
    hint.classList.add('show');
  } else {
    const hint = document.getElementById('click-hint');
    hint.classList.remove('show');
  }

  saveStateToStorage();
}

function renderCellEditBody(){
  const editId = state.editingCell;
  const isWing = isWingId(editId);
  const cell = isWing ? wingCellOf(editId) : state.cells[editId];
  const body = document.getElementById('step-body');
  const showSide = ['door','mirror','glass'].includes(cell.type);
  const showColor = cell.type === 'door' || cell.type === 'drawer';
  const hasWing = SHAPES[state.shape].hasWing;
  const wingLeft = SHAPES[state.shape].wingSide === 'left';

  // Текущая колонка
  const editingCol = isWing ? null : (editId % state.cols);

  // Mini-map: подсвечивается ВСЯ колонна (а не одна ячейка). Selected cell в колонне отмечается особо.
  let miniMap = '';
  if (hasWing){
    miniMap += `<div class="cell-mini-map-wrap" style="display:flex; align-items:stretch; gap:8px">`;
    if (wingLeft){
      miniMap += `<div class="cmm-wing-col" style="display:flex; flex-direction:column; gap:3px">` +
        state.wingCells.map((wc, wi) => {
          const sel = isWing && wingRowOf(editId) === wi;
          return `<div class="cmm-wing type-${wc.type} ${sel?'selected':''}" data-mm-wing="${wi}" title="Крыло, секция ${state.wingRows - wi}" style="flex:1; min-height:26px; display:flex; align-items:center; justify-content:center">${sel?(state.wingRows - wi):''}</div>`;
        }).join('') +
        `</div>`;
    }
  }
  miniMap += `<div class="cell-mini-map ${hasWing?'':'standalone'}" style="grid-template-columns:repeat(${state.cols},1fr); flex:1">`;
  for (let i = 0; i < state.cells.length; i++){
    const cc = state.cells[i];
    const r = Math.floor(i / state.cols);
    const c = i % state.cols;
    const isInSelCol = !isWing && c === editingCol;
    const isExact = !isWing && i === editId;
    const cls = `cmm-cell type-${cc.type} ${isInSelCol?'in-col':''} ${isExact?'selected':''}`;
    miniMap += `<div class="${cls}" data-mm-cell="${i}" title="ряд ${r+1}, колонка ${c+1}">${isExact?(r+1)+'.'+(c+1):''}</div>`;
  }
  miniMap += `</div>`;
  if (hasWing){
    if (!wingLeft){
      miniMap += `<div class="cmm-wing-col" style="display:flex; flex-direction:column; gap:3px">` +
        state.wingCells.map((wc, wi) => {
          const sel = isWing && wingRowOf(editId) === wi;
          return `<div class="cmm-wing type-${wc.type} ${sel?'selected':''}" data-mm-wing="${wi}" title="Крыло, секция ${state.wingRows - wi}" style="flex:1; min-height:26px; display:flex; align-items:center; justify-content:center">${sel?(state.wingRows - wi):''}</div>`;
        }).join('') +
        `</div>`;
    }
    miniMap += `</div>`;
  }

  let html = miniMap;

  // === БЛОК ПРЕСЕТОВ ДЛЯ КОЛОННЫ удалён (шаблоны пока не используются) ===

  html += `
    <div class="section-label">${isWing ? 'Тип углового крыла' : `Тип ячейки${state.rows > 1 ? ' (ряд ' + (Math.floor(editId/state.cols)+1) + ')' : ''}`}</div>
    <div class="cell-type-grid">
      ${Object.entries(CELL_TYPES).map(([k,v]) => `
        <div class="tile ${cell.type===k?'on':''}" data-cell-type="${k}">
          <div class="tile-icon">${ICONS[k]}</div>
          <div class="tile-label">${v.name}</div>
        </div>`).join('')}
    </div>
  `;

  // Наполнение — для всех типов кроме ящика (там фасад и есть наполнение)
  if (cell.type !== 'drawer'){
    const isCustom = cell.filling === 'custom';
    html += `
      <div class="section-label">Наполнение ${isWing?'крыла':'ячейки'}</div>
      <div class="tile-grid cols-4">
        ${fillingOptionsForUI().map(([k,v]) => `
          <div class="tile compact ${(cell.filling||'auto')===k?'on':''}" data-cell-filling="${k}">
            <div class="tile-icon">${ICONS['fill_'+k]}</div>
            <div class="tile-label">${v.name}</div>
            <div class="tile-sub">${v.sub}</div>
          </div>`).join('')}
      </div>`;

    // === КОНСТРУКТОР ЗОН: своя комбинация снизу вверх ===
    // Высота ячейки в мм для подсказок остатка
    const gridHmm_ce = state.height - state.socket - (state.antresol ? state.antresolH : 0) - 32;
    const cellHmm_ce = isWing ? gridHmm_ce : Math.round(gridHmm_ce / state.rows);
